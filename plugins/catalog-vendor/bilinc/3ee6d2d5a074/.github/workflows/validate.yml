name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: Fordex/duckwork-agent
          path: duckwork-agent
      - uses: astral-sh/setup-uv@v6
      - name: Install Duckwork
        run: |
          uv venv --python 3.14 .venv
          VIRTUAL_ENV=.venv uv pip install -e ./duckwork-agent pytest
      - name: Unit tests
        run: DUCKWORK_AGENT_PATH=$GITHUB_WORKSPACE/duckwork-agent .venv/bin/python -m pytest -q plugin/tests
      - name: duckwork plugins validate
        run: |
          export DUCKWORK_HOME=$(mktemp -d)
          .venv/bin/duckwork plugins validate ./plugin --install-deps
