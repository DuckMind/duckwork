description: >-
  Per-call delegation across your own subscriptions. The model sends each subagent to a named route with delegate_to(route, goal, context); each route pins a provider Duckwork already knows (Claude, Codex or Antigravity subscription plugins, ACP provider plugins) and a model. delegate_task, by contrast, uses the one target in config.yaml. Subagents launch through ctx.subagent_lifecycle. A child counts as out of quota only on an unambiguous provider error or a measured window at 100 %, and the route never switches on its own: a policy decides whether the parent asks you, picks another route, or waits. Disclosure: a pre_tool_call hook blocks delegate_task spawns while routes are configured (list/steer/stop pass); an api_request_error hook records quota errors in memory. Quota is read with Duckwork' fetch_account_usage (Anthropic and OpenAI Codex) on /ohx quota and after a provider error. No other network egress, no files written.
maintainer: Fordex
