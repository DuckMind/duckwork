name: "duckwork-t3-control"
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63 # v1.5.0
description: Bounded tools to list, read, create, and control local T3 coding threads on Linux and WSL2.
maintainer: Fordex
tier: community
category: tools
requires_duckwork: ">=0.20.4"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/duckwork-t3-control/3a27ec830dd2/README.md"
platforms: [linux]
# Stock Duckwork: t3_thread_send requires completion_policy: "none".
# Automatic completion callbacks are experimental, disabled by default, and
# require separately patched host APIs; this entry does not install that patch.
capabilities:
  provides_tools:
  - t3_threads
  - t3_thread_read
  - t3_thread_create
  - t3_thread_send
  - t3_thread_set_mode
  - t3_thread_implement_plan
  - t3_turn_interrupt
  - t3_session_stop
  - t3_thread_wait
  - t3_thread_respond
  - t3_thread_settle
  provides_hooks: []
  provides_middleware: []
  # Local CLI authentication requires no environment credential. External-token
  # mode optionally uses the profile secret T3_ORCHESTRATION_TOKEN. The optional
  # operator Desktop readiness probe uses DUCKWORK_DASHBOARD_SESSION_TOKEN.
  requires_env: []
aliases:
- "hermes-t3-control"
legacy_sources:
- "https://github.com/thetasigmaio/hermes-t3-control"
subdir: plugins/catalog-vendor/duckwork-t3-control/3a27ec830dd2
image: ''
screenshots: []
