description: "Federated web search backend (provider name `federated`): fans one query out to multiple configured search backends in parallel and returns merged, deduplicated, relevance-ranked results (keyword scoring; optional LLM re-rank with automatic fallback). Phase 2 — official settings-page exposure (config_schema, six keys) merged with the legacy web.federated block, and per-line multi-card credential pools (environment-variable names only) with automatic failover and host-aligned cooldowns. Phase 3 — a desktop card config page (Settings → Plugins; opt-in via Settings → Skills & Tools → Plugins): one card per line, two-level membership checkboxes (backends / credentials), add/remove lines and keys, a per-line Key rotation strategy (pool_strategy), an LLM ranker model picker (seventh schema key `ranker`), and a current-settings string with paste import; no type picker/badges (`type` round-trips verbatim); every edit serializes back to the settings tree (string ↔ UI parity). The LLM re-rank request pins thinking off (`reasoning_effort=off`) and the card page states it. Disclosure — reads the operator's config.yaml (read-only) for its own settings (web.federated and plugins.entries.duckwork-federated-search.settings); sends the query to the operator-configured sub-backends (registered providers or custom HTTP endpoints); no telemetry, no subprocesses, no credential storage (key values stay in the runtime environment)."
