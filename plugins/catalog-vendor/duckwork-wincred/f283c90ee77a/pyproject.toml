[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duckwork-wincred"
version = "0.1.0"
description = "Windows Credential Manager secret source for Duckwork Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/DuckMind/duckwork"
Issues = "https://github.com/DuckMind/duckwork"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["duckwork_wincred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: touches the real Windows Credential Manager (set DUCKWORK_WINCRED_LIVE=1)",
]
