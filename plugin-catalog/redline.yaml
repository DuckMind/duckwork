description: "Guided Markdown and source-code review in Duckwork Desktop — annotate passages or line-numbered code in a docked pane and send comment/question/change-request batches back to the agent; cards are offered automatically on delivered Markdown. Disclosure — reads any user-selected local .md/.markdown or source-code path (.py .sh .js .ts .tsx .c .h .cpp .go .rs .rb .yaml .yml .json .toml .sql, so config files such as config.yaml or auth.json are shown if you open them) up to 1 MB (symlink-resolved), writes only a <file>.redline.json sidecar beside it, and in Duckwork Desktop chats the transform_llm_output hook appends a ::redline directive line to qualifying final agent responses; syntax highlighting uses Pygments in the local gateway host with plain-text fallback; no network beyond the local gateway, no credentials, no telemetry, no subprocesses; the pane polls the local backend every 3 s while open."
maintainer: Fordex
tier: community
