description: "NATS JetStream event bus: agents publish events (nats_publish), pull one batch (nats_fetch), and wake on subject matches — live-session watches or wake routes (config-declared or runtime-registered via jetstream_wake) with durable consumers, manual ack, an idempotent wake ledger and rate rails; an opt-in lifecycle tap mirrors Duckwork events onto duckwork.> subjects. Disclosure — connects only to the NATS servers in your own config (no third-party calls, no telemetry); the platform adapter holds persistent subscriptions and reconnect loops for the gateway's lifetime; token/nkey/user-pass secrets come from ${VAR} references read via the profile-scoped secret scope and a configured creds file is read from its path, never written or rotated; wake routes render event payloads into prompts that start gateway turns or fire an existing cron job (optionally under another named profile), the agent itself can add up to 16 durable wake routes with jetstream_wake that persist in plugin data across restarts (subject still limited to subscribe_allowed, no cron-job or cross-profile targets), and jetstream_watch injects matching events into the live session when allow_gateway_injection is on, so keep subscribe_allowed scoped to trusted publishers."
