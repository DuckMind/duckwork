description: "Vector (vectorapp.io) messaging platform plugin: Duckwork becomes a first-class Nostr-based Vector bot (its own nsec/npub identity), relaying DMs through a local Rust sidecar that wraps vector-sdk. First run needs `duckwork gateway setup`, which provisions the bot identity (create or import). Disclosure — `duckwork gateway setup` downloads a prebuilt vector-bridge binary from github.com/BonesGit/duckwork-vector-platform/releases (tag v<version>, sha256 checked against that release's SHA256SUMS; set vector.prebuilt.download: false to build from the bundled Rust source), merges `vector:` settings into ~/.duckwork/config.yaml, writes VECTOR_* to ~/.duckwork/.env, and publishes a public bot profile (kind-0, bot: true) to Nostr discovery relays."
maintainer: BonesGit
