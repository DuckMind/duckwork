name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        duckwork:
          - { label: 'floor v0.21.6', ref: 818c13be1dc4fd28987e1e881a9408224afd4535 }
          - { label: 'v0.22.2', ref: d923a5eb487a17c0a68801bba9ef0f56c81040a8 }
    name: Python ${{ matrix.python }} · Duckwork ${{ matrix.duckwork.label }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Fordex/duckwork-agent
          ref: ${{ matrix.duckwork.ref }}
          path: duckwork
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare isolated Duckwork environment
        run: |
          python -m venv "$RUNNER_TEMP/duckwork-test-venv"
          "$RUNNER_TEMP/duckwork-test-venv/bin/python" -m pip install -e "$GITHUB_WORKSPACE/duckwork[dev]"
          echo "DUCKWORK_SOURCE=$GITHUB_WORKSPACE/duckwork" >> "$GITHUB_ENV"
          echo "DUCKWORK_PYTHON=$RUNNER_TEMP/duckwork-test-venv/bin/python" >> "$GITHUB_ENV"
          echo "DUCKWORK_HOME=$RUNNER_TEMP/duckwork-test-profile" >> "$GITHUB_ENV"
      - name: Contract tests
        run: bash plugin/scripts/test.sh
      - name: Plugin validation
        working-directory: duckwork
        run: '"$DUCKWORK_PYTHON" -m duckwork_cli.main plugins validate "$GITHUB_WORKSPACE/plugin" --install-deps'
