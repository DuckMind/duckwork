description: "Publish what Duckwork builds (reports, dashboards, briefs, proposals) to a private link that opens in any browser with no account for the viewer, set a passcode or limit it to a company's email addresses, update it in place, and see who opened it and what they commented. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — hosted-only connector with no local code; every tool call goes to Stacktree's remote MCP server at api.stacktr.ee (OAuth 2.1 with dynamic client registration, token kept by Duckwork); the HTML the model passes to publish_html or update_site is stored in the user's Stacktree account and served at the returned link (unlisted by default, public when a public_slug is set); page titles, open counts and third-party reader comments from that account are read into the session; the remote tools that publish, update, gate, delete pages or email approval requests run without a Duckwork approval prompt; the required sign-in step `duckwork mcp add stacktree --url https://api.stacktr.ee/mcp --auth oauth` writes a config.yaml server entry that replaces the package's own."
