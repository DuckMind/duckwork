description: >-
  Puts the names a speech-to-text model mis-hears into the transcription prompt Duckwork sends with each voice message: terms you list (globally or per surface) and names found in this profile's memories/USER.md and MEMORY.md, most important last, within the 896 characters Duckwork keeps for Whisper-family backends; your stt.prompt stays in front. Notes written in German, Spanish, French, Italian, Dutch, Portuguese or Turkish can be named in the languages setting. Disclosure — register() adds one pre_transcription hook that returns a new prompt string; memory-derived names go only to local backends (faster-whisper, local_command) unless allow_remote is set, and the memory files are not read otherwise; reads at most 256 KB per memory file; no tools, network access, subprocesses or writes; Duckwork uploads the prompt with the audio to the configured STT provider.
maintainer: Fordex
