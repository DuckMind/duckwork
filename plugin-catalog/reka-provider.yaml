description: >-
  Reka as a Duckwork model provider: Reka's agent-capable models on Reka's OpenAI-compatible API, each with its context window, tool support and image input declared, and reasoning effort sent as Reka's top-level reasoning_effort. Pick Reka in `duckwork model` or use `--provider reka`. Disclosure — registers one model provider at import and nothing else (no tools, hooks, middleware, commands, background work or file access); chat requests (prompts, tool schemas and results, supported user images) and the model list go to https://api.reka.ai/v1 (or REKA_BASE_URL) through Duckwork's own client with REKA_API_KEY, which Duckwork reads; usage is billed to your Reka account; the plugin itself opens no connections.
maintainer: Fordex
tier: verified
category: models
requires_duckwork: ">=0.21.6"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/reka-provider/39c670e8c62d/README.md"
version: "1.0.3"
readme: true
platforms: []
known_issues:
- "Images inside tool results (screenshots, vision_analyze) reach the model as Duckwork's text summary. Images you attach to a message go to the models that accept them."
- "The model list is fixed per release. A new Reka model appears after a reviewed SHA bump."
