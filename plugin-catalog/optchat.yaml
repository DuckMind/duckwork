description: "OptChat-style endless memory for Duckwork: an append-only verbatim log plus a binary summary tree, exposed as recall through the MemoryProvider ABC. Background compactor builds the tree with a cheap auxiliary model (call_llm task optchat_compact); prefetch returns a fixed-budget view of the whole history; optchat_zoom/optchat_date tools open any line down to the verbatim message. Disclosure — every turn's user messages, agent replies, tool calls and tool results (each result capped at 30,000 characters, after Duckwork's secret redaction) are appended permanently to unencrypted owner-only files under $DUCKWORK_HOME/optchat/, with no deletion or retention limit; a background compactor sends those messages and the surrounding summary view to your auxiliary model route (task optchat_compact) for summarization; each turn injects up to view_budget_chars (default 16,000) of that history into the model context."
