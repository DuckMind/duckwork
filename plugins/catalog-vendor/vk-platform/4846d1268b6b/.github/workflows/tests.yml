name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        duckwork-ref: [main, v2026.9.14]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Scoped gateway imports need dotenv/httpx and local-runtime psutil.
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 pyyaml==6.0.3 python-dotenv==1.2.3 httpx==0.28.1 psutil==7.2.2
          git clone --depth 1 --branch "${{ matrix.duckwork-ref }}" https://github.com/DuckMind/duckwork /tmp/duckwork-agent
          mkdir -p /tmp/duckwork-agent/plugins/platforms/vk
          cp adapter.py plugin.yaml setup_helper.py __init__.py /tmp/duckwork-agent/plugins/platforms/vk/
      - name: Syntax check
        run: python -m py_compile adapter.py setup_helper.py __init__.py tests/test_vk_adapter.py
        env:
          PYTHONPATH: /tmp/duckwork-agent:.
      - name: Run tests
        run: |
          export DUCKWORK_PYTHON="$(command -v python)"
          /tmp/duckwork-agent/scripts/run_tests.sh "$GITHUB_WORKSPACE/tests"
        env:
          PYTHONPATH: /tmp/duckwork-agent:.
