name: gigamail
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: >-
  Email and calendar through an existing local GigaMail MCP server, with a workflow skill and stdio launcher. Requires Python and a separately configured backend; no automatic backend installation or updates. Reads real mail and attachments; sending, deletion and calendar writes use GigaMail's out-of-band human approval. Disclosure — a thin stdio launcher for the separately installed GigaMail MCP server from Adecubed inc. (gigamail.ai, github.com/adecubed/gigamail, same author as this plugin); the plugin holds no mail logic or credentials and downloads nothing, but it starts that third-party executable from PATH or a configured path, points it at GigaMail's own data directory under your user profile (%APPDATA%\ADE or ~/.ade), and send, delete and calendar writes are gated by that backend's out-of-band approval rather than by Duckwork.
