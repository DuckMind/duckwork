name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        DUCKWORK_COMMIT:
          - e06df9c2eae6901f4c88f464e0ae6e753c0428b8 # v0.22.0 support floor
          - 548091836760a67e331b8f5643be8e5c08fae1e6 # official main, 2026-10-18
    env:
      DUCKWORK_COMMIT: ${{ matrix.DUCKWORK_COMMIT }}
      HOME: ${{ github.workspace }}/../minimizer-test-home
      DUCKWORK_HOME: ${{ github.workspace }}/../minimizer-duckwork-home
      DUCKWORK_ENABLE_PROJECT_PLUGINS: "0"

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Check out pinned Duckwork source
        uses: actions/checkout@v4
        with:
          repository: Fordex/duckwork-agent
          ref: ${{ env.DUCKWORK_COMMIT }}
          path: duckwork-source
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install pinned Duckwork environment
        run: uv sync --project duckwork-source --locked --python 3.14 --group dev

      - name: Run plugin tests against real Duckwork
        env:
          DUCKWORK_SOURCE: ${{ github.workspace }}/duckwork-source
        run: uv run --project duckwork-source pytest tests -q

      - name: Stage exact plugin tree
        run: |
          mkdir -p "$RUNNER_TEMP/duckwork-minimizer"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/duckwork-minimizer"

      - name: Run native plugin doctor
        run: uv run --project duckwork-source duckwork plugins doctor "$RUNNER_TEMP/duckwork-minimizer" --ci

      - name: Run catalog admission validation
        run: uv run --project duckwork-source duckwork plugins validate "$RUNNER_TEMP/duckwork-minimizer" --install-deps
