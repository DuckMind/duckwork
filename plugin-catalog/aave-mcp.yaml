description: "Aave V3 and V4 through Aave's official MCP server (Streamable HTTP at https://mcp.aave.com, no sign-in, no keys in config): live markets and rates on every chain Aave runs on, wallet positions and health factor, rewards, DAO governance, swap quotes, and unsigned transactions for the user's own wallet to sign. Bundles five workflow skills: safe transactions, deleverage, yield analysis, account activity and transaction confirmation. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to mcp.aave.com, which records tool usage for analytics and keeps a wallet address only as a keyed hash. The server never holds keys. Every tool is annotated read-only except submit_signed_order and cancel_order, which relay an order or cancellation the user already signed; the package marks the server untrusted, so Duckwork asks before either runs and refuses them in unattended runs. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
