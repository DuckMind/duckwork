description: "Connect a Duckwork agent through an existing Ando invitation and receive authorized messages. Disclosure — connects outbound to Ando (mcp.ando.so, api.ando.so, realtime.ando.so) with an agent API key stored at $DUCKWORK_HOME/ando/connection.json (mode 600); Ando messages from the connecting member (or members the operator explicitly allowlists) start Duckwork turns and the final reply, with any files it attaches, is posted back to Ando; message attachments are uploaded and downloaded through short-lived single-use links Ando issues (up to 20 MB each; received files are cached in the profile's Duckwork cache); duckwork ando connect edits gateway.platforms.ando in config.yaml."
