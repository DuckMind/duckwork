description: >
  CortexLayer memory provider — page-linked long-term memory with link-expansion retrieval, wired into Duckwork' automatic per-turn recall (prefetch) and persistence (sync_turn), plus a pre-compress checkpoint so evidence Duckwork' own context compaction would otherwise drop is saved first. Platform mode only: each turn's query and conversational content is sent to the hosted api.cortexlayer.net (HTTPS, API-key authenticated) for storage/retrieval — no local/offline mode. Requires a free CortexLayer account and API key.
