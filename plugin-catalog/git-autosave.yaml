name: git-autosave
title: Git Autosave
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Lightweight local alternative to directory checkpoints for Git projects. Before a mutating tool call it saves the affected repository's working state to a private local shadow ref (refs/duckwork-autosave/<branch>, with reflog) through a private index, or copies the single existing file outside Git; `duckwork autosave find` and `restore` recover a pre-edit version. Disclosure — runs local git subprocesses in repositories the agent touches (hooks, clean filters, fsmonitor and lazy fetch disabled); writes shadow refs/reflogs into those repositories' .git and unencrypted file copies into its plugin-data directory; never changes HEAD, branches, the real index or the working tree and never pushes; skips credential stores (.env, auth.json, .ssh, .aws, .docker, .kube, gh/gcloud/azure configs) and dependency directories; `duckwork autosave sweep` reads the session database read-only and is scheduled by the user; no network, no background processes; it observes only and never blocks or approves a tool call."
maintainer: Fordex
tier: community
category: tools
requires_duckwork: ">=0.22.0"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/git-autosave/08d32d02f39b/README.md"
version: "0.3.0"
readme: true
platforms: [linux, macos]
known_issues:
- "One V4A patch that moves a symlink and then updates the moved path can miss the edited file on case-insensitive or Unicode-normalizing filesystems; commit first or send the Move and the Update as separate calls."
