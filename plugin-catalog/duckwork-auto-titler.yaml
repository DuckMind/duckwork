description: "Topic-aware session title tracking for Duckwork Agent. Duckwork generates the first title by default; AutoTitler follows conversation changes and session close without changing the host title-generation switch. Disclosure — sends excerpts of each conversation (sampled user turns, short assistant replies, compaction summaries) to your Duckwork title-generation model in the background, also for up to 200 recent untitled sessions at startup; needs plugins.entries.duckwork-auto-titler.llm.allow_task_override (or allow_provider/model_override for a custom route). 0.3 no longer edits config.yaml, but users upgrading from 0.2.x keep auxiliary.title_generation.enabled=false until they re-enable it (/autotitler status shows the fix)."
