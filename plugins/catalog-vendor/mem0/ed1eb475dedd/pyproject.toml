[project]
name = "duckwork-plugin-mem0"
version = "1.3.0"
description = "Duckwork Agent memory provider plugin: mem0"
requires-python = ">=3.11"
license = { text = "Apache-2.0 AND MIT" }
# Installed into the Duckwork venv by `duckwork plugins install` / `enable` and re-applied after
# every `duckwork update` (duckwork-agent#113851). Keep upper bounds: Duckwork pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "mem0ai>=2.0.10,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgres = ['psycopg2-binary>=2.9,<3']
qdrant = ['qdrant-client>=1.9,<2']
