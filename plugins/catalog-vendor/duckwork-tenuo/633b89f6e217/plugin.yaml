# Modified by Fordex for Duckwork distribution on 2026-11-17: fork-owned names and paths rebranded; original authorship and notices retained.
name: duckwork-tenuo
version: 0.1.3
description: >
  Per-call authorization for Duckwork Agent tool calls.
  Each call is checked against a signed, expiring warrant before the
  handler runs, including argument constraints.
author: Tenuo AI
license: Apache-2.0
homepage: https://github.com/DuckMind/duckwork
kind: standalone
# Duckwork never installs plugin pip dependencies; `duckwork plugins install` prints this list.
python_dependencies:
  - "tenuo>=0.3.2"
requires_duckwork: ">=0.20"
tags: [security, authorization, warrants, tenuo]
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - subagent_start
requires_env:
  - name: TENUO_WARRANT
    description: "Base64-encoded warrant or path to a .warrant file. Required to activate enforcement (or set plugins.entries.duckwork-tenuo.warrant)."
    required: false
  - name: TENUO_SIGNING_KEY
    description: "Base64-encoded Ed25519 signing key matching the warrant holder (proof-of-possession)."
    required: false
