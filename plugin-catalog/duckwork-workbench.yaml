description: The Duckwork desktop app in your browser. `duckwork workbench` serves the desktop interface through the Duckwork dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Fordex product. On the first `duckwork workbench` run and again after each Duckwork update it runs `npm install --ignore-scripts` (guided by Duckwork's lockfile) and Vite against your Duckwork checkout's desktop sources, writing only under ~/.duckwork/duckwork-workbench and its own plugin dir (the checkout is only read), and starts `duckwork dashboard` on loopback when none is running.
