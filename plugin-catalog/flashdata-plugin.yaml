description: "Web search with Google Search; Google News, Google Images, Google Shopping, Google Video Search and Google Places for research. Use YouTube Search or YouTube Extended Search; retrieve YouTube metadata, YouTube transcripts, YouTube captions and YouTube channel data; get YouTube autocomplete; inspect YouTube trainability as license-label metadata, not training permission. YouTube downloads deliver media to your own storage. One hosted MCP connection and 15 task Skills; bring your own API key and paid FlashData Credits. Disclosure — Connects to FlashData's hosted MCP service (data.flashdata.dev) with your own FLASHDATA_API_KEY; every search, YouTube read or download spends your paid FlashData Credits, and Duckwork asks before running only the tools the server does not mark read-only, so most paid searches run without a prompt. The YouTube download tool sends the storage bucket and storage access credentials you supply to FlashData, and those values stay visible in the chat history."
