name: jp-estat
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Japanese government statistics from the e-Stat API: search tables and fetch figures such as population, households, wages, and prices, with estat_search_tables, estat_table_info, and estat_get_data. Disclosure — It needs a free e-Stat application ID, set as ESTAT_APP_ID in the .env of each profile. Each call sends your search words and table selections to api.e-stat.go.jp and puts ESTAT_APP_ID in the request URL. The ID is read for the active profile on each call. An HTTP proxy set in the environment is not used, and no other host is called. Nothing is written to disk, and this plugin creates no cron job. The tools are on for every surface, including gateways, so anyone you allow there can call them with your ID. Turn a surface off with duckwork tools. While the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off."
maintainer: Fordex
