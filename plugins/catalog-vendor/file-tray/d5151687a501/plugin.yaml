name: file-tray
version: 0.1.0
manifest_version: 1
api_version: 1
description: >
  Session file tray: paths the Duckwork agent actually touched via read_file,
  write_file, or patch. Desktop pane and /files; no API keys and no file
  writes of its own.
author: aydnOktay
license: MIT
homepage: https://github.com/DuckMind/duckwork
requires_duckwork: ">=0.21"
tags: [desktop, files, paths, tools]
provides_tools:
  - file_tray_list
  - file_tray_clear
provides_hooks:
  - post_tool_call
config_schema:
  max_items:
    type: int
    default: 40
    description: Maximum unique file paths kept for the current session tray.
