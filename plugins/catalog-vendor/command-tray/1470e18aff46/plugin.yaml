name: command-tray
version: 0.1.0
manifest_version: 1
api_version: 1
description: >
  Session command tray: shell commands the Duckwork agent ran via the terminal
  tool (success and failure). Desktop pane and /commands; no API keys. Does
  not re-execute commands itself.
author: aydnOktay
license: MIT
homepage: https://github.com/DuckMind/duckwork
requires_duckwork: ">=0.21"
tags: [desktop, terminal, commands, tools]
provides_tools:
  - command_tray_list
  - command_tray_clear
provides_hooks:
  - post_tool_call
config_schema:
  max_items:
    type: int
    default: 40
    description: Maximum unique commands kept for the current session tray.
