description: "Native Anatomy community gallery with search, local favorites and explicit sandboxed standalone playback. Disclosure — when opened it fetches gallery metadata and thumbnails from a third-party GitHub repository (wheresryan22/anatomy-community, resolved at runtime from its mutable previews branch via api.github.com and raw.githubusercontent.com). \"Open figure in Duckwork\" downloads that community figure's HTML and runs its JavaScript inside the Desktop SDK sandbox (opaque origin, scripts only), and \"Browse Ryan's website\" embeds skills.wheresryan.sh the same way. Favorites and filters stay in Desktop-local plugin storage; no credentials or Duckwork data are sent."
