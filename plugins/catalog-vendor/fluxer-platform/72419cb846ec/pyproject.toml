[project]
name = "duckwork-fluxer-plugin"
version = "0.3.3"
description = "Fluxer platform plugin for Duckwork Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Duckwork Fluxer Plugin Contributors" }
]
dependencies = [
  "httpx>=0.24",
  "websockets>=11",
]

[project.urls]
Homepage = "https://github.com/DuckMind/duckwork"
Duckwork = "https://duckwork-agent.fordex.com/docs"
Fluxer = "https://fluxer.app"

[project.optional-dependencies]
realtime = [
  "livekit>=1.1.10",
]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "PyYAML>=6",
  "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
py-modules = ["adapter", "livekit_bridge", "xai_realtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Keep CI independent from Ruff's expanding default rule set. Bandit and
# CodeQL provide the separate security-focused gates.
select = ["E4", "E7", "E9", "F"]
