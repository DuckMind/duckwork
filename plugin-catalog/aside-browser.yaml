name: aside-browser
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Use the signed-in Aside browser as Duckwork's browser when the Aside CLI is installed. Disclosure — runs the local aside CLI to drive your signed-in Aside browser (page text, screenshots, Aside memory, model-written JavaScript via aside_repl) without a Duckwork approval prompt; Aside's permission level is a user-only setting (default ask) that covers aside_exec only. Optional pre_tool_call hook blocks Duckwork' built-in browser tools while Aside is ready when browser_policy is always. Reads Aside's settings.json for the model list; no telemetry."
maintainer: Fordex
tier: community
category: tools
requires_duckwork: ">=0.21.0"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/aside-browser/1c864a179e67/README.md"
version: "0.3.0"
platforms: []
known_issues:
- Drives the signed-in Aside browser on this machine. Does not install Aside.
capabilities:
  provides_tools:
  - aside_status
  - aside_exec
