title: ngrok AI Gateway
description: >-
  The ngrok AI Gateway as a Duckwork model provider (`--provider ngrok`, or ngrok AI Gateway in `duckwork model`): one access key for all your model providers, with failover. The model list comes live from your gateway, and gateway errors (unrouted model, access-policy and upstream-key failures, out of credit) map onto Duckwork' fallback instead of a generic error. Disclosure — registers one model provider at import and nothing else (no tools, hooks, commands or threads); chat requests and the model list go to https://gateway.ngrok.ai/v1 (or NGROK_AI_GATEWAY_BASE_URL) through Duckwork' own client with NGROK_AI_GATEWAY_KEY, which Duckwork reads; the plugin itself opens no connections, reads and writes no files and starts no processes.
