title: Profile Switcher
description: 'The Alt+Tab gesture for Duckwork profiles. Hold Ctrl+Alt and tap Tab to cycle through your profiles, release to land on the highlighted one — the same hold-tap-release rhythm as the OS app switcher. (Alt+Tab, Win+Tab and Cmd+Tab are owned by the window manager and cannot be bound by any application, so the gesture lives on ctrl+alt+tab, unclaimed by the OS and by Duckwork core.) Each row shows the profile''s model and most recent conversation; a working profile shows a spinner. Also opens with a single contributed keybind (Cmd+Alt+P / Ctrl+Alt+P, rebindable in the app''s own keybind panel), a status-bar chip, and a palette command. The switch goes through the Desktop''s own profile path, so the target profile''s backend is activated and its chrome is scoped onto it. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware, env vars, network calls, or stored credentials.'
