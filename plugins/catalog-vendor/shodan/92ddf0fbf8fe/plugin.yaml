name: shodan
version: 0.1.1
manifest_version: 1
description: >-
  Shodan.io for Duckwork. Host intel, search, DNS, CVE lookups, network
  monitoring and on-demand scanning, with a per-session credit budget and
  response shaping that keeps results inside the context window.
author: Adolanium
kind: standalone

# All registered tools. Visibility is controlled by the core/full profile
# and API-key checks; scanning also requires explicit configuration.
provides_tools:
  - shodan_host
  - shodan_search
  - shodan_count
  - shodan_dns
  - shodan_cve
  - shodan_account
  - shodan_meta
  - shodan_scan
  - shodan_alert
  - shodan_exploits
  - shodan_query
  - shodan_trends

provides_hooks:
  - on_session_start
  - on_session_reset

requires_env:
  - name: SHODAN_API_KEY
    description: >-
      Shodan API key. Found under "Account" once you are signed in. Without
      one the plugin still runs, but only the keyless endpoints work
      (InternetDB host lookups and CVEDB vulnerability data).
    url: https://account.shodan.io
    secret: true
