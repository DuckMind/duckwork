version: "0.2.1"
description: >-
  Bounded image-to-GLB jobs using an isolated Remesher CLI, with existing ComfyUI/Comfy3D or native TRELLIS.2 and Pixal3D runtimes. Four Python SDK tools provide health, generation, persistent job status and hashed GLB assets, plus a setup/generation skill. Apache-2.0 for Remesher code; third-party terms remain separate. Disclosure — reads selected local images and configured files, uploads images to the configured ComfyUI server, launches local CLI subprocesses and detached supervisors, optionally owns a GPU runtime, and stores inputs, logs and assets in profile plugin data. Client/runtime installation and model downloads require separate explicit opt-ins; no model weights are bundled. No credentials or telemetry are required. No Desktop viewer or hosted service is included.
maintainer: Fordex
tier: community
category: tools
requires_duckwork: ">=0.22.2"
platforms: [linux]
readme: true
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/remesher/696aacd04478/README.md"
known_issues:
- Native inference tested on Linux ARM64 NVIDIA Spark only; macOS, Windows, CPU, MPS and ROCm inference are not certified.
- Requires Python 3.11+, a separately installed CLI and configured runtime/model files. Native quality settings are explicit resource-intensive opt-ins, not automatic defaults.
- Single-image quality remains provisional; no automatic background removal, manifold, watertightness or production-anatomy guarantee.
- One active job per profile; retention is manual and native runtime logs are not size-capped. Local timeout does not cancel work on an existing remote server.
capabilities:
