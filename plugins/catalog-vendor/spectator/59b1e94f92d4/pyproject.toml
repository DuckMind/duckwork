[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckwork-spectator"
version = "0.3.0"
description = "Harness-neutral live session sharing, summaries, and branch queries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sahil Saghir" }]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
    "websockets>=12.0",
]

[project.scripts]
spectator-serve = "spectator.serve:main"
spectator-hook = "spectator.bridge.cli:main"
spectator-integrations = "spectator.integrations:main"

[project.entry-points."duckwork_agent.plugins"]
spectator = "spectator.duckwork_plugin"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# This module bootstraps src/ for clone-style Duckwork directory plugins.
"dashboard/plugin_api.py" = ["ASYNC240", "B904", "E402"]
"tests/**" = ["B017", "F841", "RUF059"]

[tool.hatch.build.targets.wheel]
packages = ["src/spectator", "dashboard"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard/static/guest.html" = "dashboard/static/guest.html"
"dashboard/manifest.json" = "dashboard/manifest.json"
