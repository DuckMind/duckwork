[project]
name = "duckwork-structured-aux-models"
version = "0.1.0"
description = "Routes selected Duckwork auxiliary tasks through bounded Jev decision calls on OpenRouter instead of free-form chat prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trajectoire AI" }]
# Intentionally dependency-free at runtime: the decision transport uses urllib from the
# standard library, and schema validation reuses Duckwork' own optional jsonschema.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/DuckMind/duckwork"
Issues = "https://github.com/DuckMind/duckwork"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
