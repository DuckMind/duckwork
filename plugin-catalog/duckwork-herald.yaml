name: "duckwork-herald"
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Cross-profile agent dispatch for Duckwork Agent — 12 tools for agents talking to agents: async dispatch with SSE completion, synchronous multi-turn chat, model-selectable in-process subagents, a durable SQLite run ledger, fail-closed per-target model-route discovery, and host-owned bare LLM inference. Disclosure — sends task text and bearer tokens to the Duckwork API servers you configure (plaintext HTTP permitted, warn-only); stores full dispatch text in a local SQLite ledger; delegate_subagent may use any provider credential you have configured."
# Known limitation before you install: Herald's config-home resolution and credential
# interpolation read the process environment rather than Duckwork' per-profile scope, so
# origins are not isolated under multiplex mode — run them as separate single-profile
# processes. See the repo README, "Trust boundaries → Multiplex limitation (known, unfixed)".
maintainer: Fordex
