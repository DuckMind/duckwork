name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q llm_antidote scripts
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov=llm_antidote --cov-report=term-missing --cov-fail-under=80
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  duckwork-plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install 'cryptography>=42,<47' 'packaging>=20' 'PyYAML>=6,<7' 'ruamel.yaml>=0.18,<0.19'
      - name: Fetch pinned Duckwork Agent 0.21.5 validator
        run: |
          git init /tmp/duckwork-agent
          git -C /tmp/duckwork-agent remote add origin https://github.com/DuckMind/duckwork
          git -C /tmp/duckwork-agent sparse-checkout init --cone
          git -C /tmp/duckwork-agent sparse-checkout set duckwork_cli plugins tools agent pm gateway duckwork_platform
          git -C /tmp/duckwork-agent fetch --depth 1 origin f97608f178d1ffeca59860195ab7da295f7c8e5f
          git -C /tmp/duckwork-agent checkout --detach FETCH_HEAD
      - name: Validate Duckwork plugin contract
        env:
          PYTHONPATH: /tmp/duckwork-agent
        run: |
          python -c 'from pathlib import Path; from duckwork_cli.plugin_validate import validate_plugin_dir; result = validate_plugin_dir(Path(".")); print(result.to_dict()); raise SystemExit(result.exit_code)'

  duckwork-plugin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install plugin and validation dependencies
        run: python -m pip install -e . 'packaging>=20' 'PyYAML>=6,<7' 'ruamel.yaml>=0.18,<0.19'
      - name: Fetch pinned Duckwork Agent 0.21.5 source
        run: |
          git init /tmp/duckwork-agent
          git -C /tmp/duckwork-agent remote add origin https://github.com/DuckMind/duckwork
          git -C /tmp/duckwork-agent sparse-checkout init --cone
          git -C /tmp/duckwork-agent sparse-checkout set duckwork_cli plugins tools agent pm gateway duckwork_platform
          git -C /tmp/duckwork-agent fetch --depth 1 origin f97608f178d1ffeca59860195ab7da295f7c8e5f
          git -C /tmp/duckwork-agent checkout --detach FETCH_HEAD
      - name: Drive real Duckwork hooks (standalone)
        env:
          PYTHONPATH: /tmp/duckwork-agent
        run: python tests/integration/duckwork_e2e.py --mode standalone
      - name: Drive real Duckwork hooks (enforced)
        env:
          PYTHONPATH: /tmp/duckwork-agent
        run: python tests/integration/duckwork_e2e.py --mode enforced
