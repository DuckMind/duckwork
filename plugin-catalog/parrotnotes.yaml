description: >-
  Find, search, summarize and save insights for your ParrotNotes in-person meeting notes through the hosted ParrotNotes MCP server (Streamable HTTP, OAuth 2.0 + DCR), with the parrotnotes workflow skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — hosted-only connector with no local code: every tool call goes to the vendor's remote MCP server at mcp.parrotnotes.app (OAuth via a Supabase auth backend); note titles, transcripts and insights from the user's ParrotNotes account are pulled into the session context, and text the model passes to save_note_insight is written to that account. OAuth must be enabled with `duckwork mcp add parrotnotes --url https://mcp.parrotnotes.app/mcp --auth oauth`; the bundled mcp.json alone yields 401.
