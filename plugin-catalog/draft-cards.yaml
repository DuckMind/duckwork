title: Draft Cards
description: "Email and chat-message drafts as reviewable cards in the Duckwork Desktop chat. The agent's draft_card tool stores each draft and its revisions; the card shows recipients, subject and body, highlights the words each revision changed (removed text on demand), supports inline editing, and offers Copy and Open in Mail. The plugin never sends anything: pressing Send records approval of that exact version and posts it to the chat, then the agent sends it with the user's existing mail or messaging tools and reports the outcome with draft_card_status. Disclosure — stores draft text (recipients, subject, body, versions) in the profile's plugin-data/draft-cards/drafts.db (the 500 most recent drafts are kept); the desktop half appends one scoped stylesheet, removed on disable; no network calls, no credentials, no shell commands, no background processes, no telemetry."
maintainer: Fordex
tier: community
