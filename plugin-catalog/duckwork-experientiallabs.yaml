description: "Experiential Labs - OpenAI-compatible multi-model gateway provider (chat, /model picker, aux and curated fallback models, /usage wallet snapshot). All network calls go to api.experientiallabs.ai - /v1 chat + models via Duckwork' own transport, /api/v1/credits and /api/v1/key only when /usage runs; no telemetry; credentials resolve through Duckwork routes (duckwork auth / .env). Disclosure — When you pick Experiential Labs as your model, every prompt, tool result and attachment of that session goes to api.experientiallabs.ai, a third-party gateway that routes to upstream model vendors. /usage sends your key to its Cost API (GET /credits and /key) or to the cost_api_base you set. Independent integration, not affiliated with Experiential Labs."
