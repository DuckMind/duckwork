name: wallpaper-theme
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: >-
  A Duckwork Desktop theme that follows your wallpaper. Reads Pywal's ~/.cache/wal/colors.json by default, or any palette JSON you point it at (settings page or ~/.config/duckwork-wallpaper-theme/config.json), derives a palette with checked contrast floors and repaints live when the file changes. Optional glass mode paints a translucent background for native window materials or compositor blur. Disclosure — the desktop half uses only @duckwork/plugin-sdk; the palette file is read by the package's own backend route (dashboard/plugin_api.py, GET /api/plugins/wallpaper-theme/palette, mounted once the plugin is in plugins.enabled), polled every 3 seconds with a change stamp. That route reads only JSON files inside the user's home directory (or XDG_*_HOME) under 256 KiB and returns colour fields only, never raw file text. No network calls, no shell commands, no credentials, no telemetry.
