description: Asks the user to confirm a tool call whose arguments look like a repetition loop rather than data, through Duckwork' approval gate (denied or unanswered means refused); replaces flagged degenerate output with a short notice; warns when a session grows long. Disclosure — no network, shell, subprocesses, own threads, telemetry or credentials; writes incident records and a session counter to its plugin data directory; a stream-side record keeps the last 800 characters of flagged output.
maintainer: Fordex
tier: community
