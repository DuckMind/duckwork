description: "The official Speechify text-to-speech provider (tts.provider: speechify), maintained by Speechify. Simba 3.5 voices in 48 languages with low-latency streaming in voice mode, Opus voice notes for messaging platforms, and a duckwork speechify command to list voices and hear a test line. Disclosure — sends the text being spoken, the chosen voice and model, the plugin's name and version (Speechify-Caller attribution headers), and your SPEECHIFY_API_KEY to api.speechify.ai (or the base_url / SPEECHIFY_BASE_URL you configure); synthesis is billed to your Speechify workspace; generated audio is written to Duckwork's audio cache; no tools, hooks or middleware; no telemetry."
maintainer: Fordex
tier: community
