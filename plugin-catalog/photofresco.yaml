description: "Edit images in a PhotoFresco window you approve: layers, masks, selections, adjustment layers, previews and PNG/PSD export. Portable Agent Plugins v1 package (mcp.json + skills/) with a local stdio MCP server and bundled skill; needs Node.js 22+ and Chrome, Edge or Chromium 120+. Disclosure — opens https://photofresco.com/app/ (remote web editor, live code not covered by this pin) in a separate Chrome/Edge/Chromium profile under ~/.local/share/photofresco-connector (macOS ~/Library/Application Support/PhotoFresco Connector), with cookies/sign-in/autosave kept there; previews and document state the agent requests go to your model provider; with the Send/Spend permissions granted in the PhotoFresco window, AI ops spend PhotoFresco credits up to the budget you set and cloud/feedback ops send document data to PhotoFresco, and Duckwork does not prompt before those calls; with Export granted, quick-export ops save to the browser's download folder; no local folders are readable or writable unless you add --read/--write yourself."
