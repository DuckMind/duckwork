title: "Nine-Balance Widget"
description: "Nine AI provider balances in one desktop widget — live balance/usage and quota reads, token-based spend estimates with off-peak price windows, drop alerts, and an anime mascot per provider with rotating flavour lines (DeepSeek, MiniMax, GLM, Kimi, MiMo, ChatGPT, Claude, Gemini, Grok). Fully English UI. Desktop-only: desktop/plugin.js inside the plugin SDK surface; no agent tools, hooks, middleware or env vars. Keys are entered in the widget's settings page and stored in plugin-scoped storage; the widget only calls those providers' official APIs. Ported from MeteorNOX/DeepSeek-Balance-Whale-Widget (MIT). Disclosure — API keys you enter in the widget's settings are stored in plaintext in Desktop plugin storage (not Duckwork' secret store); while the widget is on, the Desktop renderer polls the balance/usage endpoint of the provider matching your current model every 60 s with that provider's key (api.deepseek.com, api.minimaxi.com / api.minimax.io, open.bigmodel.cn / api.z.ai, api.moonshot.cn / api.moonshot.ai, api.kimi.com, token-plan-cn.xiaomimimo.com, api.openai.com, api.anthropic.com, generativelanguage.googleapis.com with the key in the URL, api.x.ai); each key goes only to its own provider; draws a floating widget over the app window."
