description: "Native Duckwork Agent plugin that runs the local Atoll notch monitor for Duckwork session and turn status on macOS. Disclosure — macOS only. Starts a detached Node daemon on every Duckwork session that reads state.db read-only and sends session titles, model/profile/token stats and a ≤96-char redacted preview of your latest request to the third-party Atoll notch app over localhost. duckwork notch setup clones and builds the author's Atoll fork (github.com/himanusia/Atoll at a pinned commit, not reviewed here) with Xcode and installs an unnotarized app to ~/Applications. Node deps install via Duckwork's npm ci prompt. Run duckwork notch stop before removing."
