description: >-
  Native XMemo memory provider for Duckwork Agent — durable, identity-aware cross-session memory with semantic search. Disclosure — cloud memory provider: sends each user prompt (for recall and the search tools), model-written memories and mirrored built-in Duckwork memory writes, plus a stable install ID, to xmemo.dev (Yonro Co., Ltd.); keeps a local SQLite cache of recalled results and a queue of unsent writes in $DUCKWORK_HOME/xmemo_cache.db, partitioned by a hashed account identity; reads the key from XMEMO_KEY (also MEMORY_OS_API_KEY / MEMORY_OS_MCP_TOKEN) and, if none is set, falls back to the xmemo login token in ~/.config/xmemo/credentials.json (a catalog rule 11 deviation kept for existing users); workflow and destructive tools and timeline capture are off by default and opt-in.
maintainer: Fordex
tier: community
category: memory
