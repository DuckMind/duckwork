description: "Per-provider quota and balance readout in the Duckwork desktop status bar. Per-provider chips with eye toggles, a popover with every quota window, reset times, balance and key-cap amounts, near-limit amber tint, a desktop notification per threshold crossing, and burn-rate projections (ETA to reset or depletion). Providers: OpenCode Go, OpenAI Codex, OpenRouter, plus Anthropic, GitHub Copilot, Fordex, Z.AI, Kimi, MiniMax and DeepSeek when configured. Disclosure — resolves provider credentials read-only (Duckwork account-usage helpers and profile secrets, else the profile's .env and the vendor CLI login files ~/.codex/auth.json, ~/.claude/.credentials.json and ~/.local/share/opencode/auth.json) and sends each only to that provider's usage endpoint; the GitHub Copilot check presents the VS Code / Copilot client identity. No subprocesses, no telemetry."
