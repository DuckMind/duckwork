[project]
name = "duckwork-s3"
version = "0.1.1"
description = "Standalone Duckwork plugin: back up files/dirs to any S3-compatible store and restore/list/remove remote objects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s3_backup"]
