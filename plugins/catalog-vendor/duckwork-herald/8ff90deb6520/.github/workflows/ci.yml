name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Duckwork Herald
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Check out compatible Duckwork Agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: Fordex/duckwork-agent
          ref: 9fc80ac70f6b97e36556c33bc4895b75558d4136
          path: duckwork-agent

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: duckwork-agent/pyproject.toml

      - name: Install Duckwork Agent and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./duckwork-agent pytest pyyaml

      - name: Release contract
        run: python scripts/check_release_contract.py

      - name: Run Duckwork Herald tests
        working-directory: tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DUCKWORK_HERALD_PLUGIN_DIR: ${{ github.workspace }}
          DUCKWORK_SOURCE_DIR: ${{ github.workspace }}/duckwork-agent
          DUCKWORK_RUNTIME_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: python -m pytest -p no:cacheprovider -q
