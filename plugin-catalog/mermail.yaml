description: Privacy-first agent email inboxes and workspace automation through hosted Mermail MCP. Portable Agent Plugins v1 package (mcp.json + skills/, seventeen skills bundled); authenticate with OAuth via `duckwork mcp login mermail`. No credentials are stored in mcp.json. Disclosure — the bundled skills also expose Mermail's paybox wallet tools over the hosted MCP (x402 payments, xStocks trading, standing grants); the skills allow the agent to move funds without a same-turn confirmation when your message already states exact terms, so spending controls live on your Mermail account, not in Duckwork.
