description: "Vietnamese (Tieng Viet) language pack for Duckwork Agent — full UI translation across every surface: core (approval prompts, gateway/slash replies, CLI, tips), TUI, and Desktop catalogs. Checked against the English catalogs with duckwork plugins validate. Parser-safe: hard-parsed menu brackets and [Y/n] prompts stay verbatim; placeholders, URLs and CLI flags preserved; multi-line values use real newlines exactly like the English catalogs. Manifest-only plugin, no code execution, no network. Ban dich tieng Viet day du cho toan bo giao dien Duckwork Agent. Disclosure — text-only catalogs; registering the pack never changes display.language, the user opts in via config."
