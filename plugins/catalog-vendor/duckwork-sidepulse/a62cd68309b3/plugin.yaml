name: duckwork-sidepulse
version: "0.2.0-beta.1"
description: Privacy-safe Duckwork lifecycle status integration for SidePulse
author: Cesar J. Garcia
kind: standalone
profile_scope: shared
# `hooks` is consumed by Duckwork v0.20; `provides_hooks` keeps the plugin
# declaration explicit for newer doctor/index tooling.
hooks:
  - on_session_start
  - on_session_reset
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
  - api_request_error
  - post_llm_call
  - on_session_end
  - on_session_finalize
provides_hooks:
  - on_session_start
  - on_session_reset
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
  - api_request_error
  - post_llm_call
  - on_session_end
  - on_session_finalize
