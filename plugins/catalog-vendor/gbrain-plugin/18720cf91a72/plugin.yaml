name: gbrain-plugin
version: "1.2.1"
description: >-
  Community (non-official) Duckwork plugin that wires GBrain (garrytan/gbrain, MIT) into
  Duckwork as a memory layer over MCP. Adds a /gbrain status command, a desktop UI
  starter, and setup/update/maintenance scripts (per-profile, Postgres provisioning,
  crons). Not affiliated with the upstream GBrain project.
author: kerrz2020
license: MIT
homepage: https://github.com/DuckMind/duckwork
tags: [gbrain, brain, memory, mcp, duckwork]
provides_commands:
  - gbrain