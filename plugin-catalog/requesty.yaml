title: Requesty
description: >-
  Requesty LLM gateway as a Duckwork model provider (`--provider requesty`, alias `rq`, or Requesty in `duckwork model`). The picker lists Requesty's managed routing policies (curated routes with failover, `@eu` variants for EU-only hosting); any Requesty model id or org policy also works. `/reasoning` maps onto Requesty's `reasoning_effort` for reasoning-capable models, the Duckwork session id is sent as `requesty.trace_id`, and context windows and estimated cost come from the Requesty catalog. Prompt caching is done server-side by Requesty. Disclosure — chat requests go to https://router.requesty.ai/v1 (or REQUESTY_BASE_URL) through Duckwork' own client with REQUESTY_API_KEY, which Duckwork reads; the plugin itself only fetches Requesty's public model catalogs (/v1/models/managed and /v1/models, no credentials), once per process, sometimes on a short-lived background thread. No attribution headers, telemetry, file access or processes. Supersedes #27908.
