title: YouTube Dock
description: >-
  Open your signed-in YouTube Home recommendations and Shorts in the existing Duckwork Desktop Browser beside your conversation, without pasting video URLs or launching an external browser. Desktop-only SDK launcher; no agent tools, hooks, middleware or API keys. Disclosure — explicit user clicks load YouTube and its normal service/CDN requests in the native Browser; this plugin does not read credentials, cookies, recommendations or watch history. No telemetry, shell commands, backend service or self-updater. Uses the native preview toggle (Hide for an already-open destination), not a dedicated PIP player.
