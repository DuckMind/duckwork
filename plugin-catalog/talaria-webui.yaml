description: "Extends Duckwork Agent API capabilities to deliver a richer chat interface with Talaria WebUI. Disclosure — adds API_SERVER_KEY-authenticated /talaria/v1 routes to the Duckwork API server (cross-session history search, rewind/branch/compress of API sessions, runs with the profile's instructions and prefill); stores response metadata (no message bodies) in $DUCKWORK_HOME/talaria/observations.db; relies on private api_server/AIAgent internals behind feature detection."
