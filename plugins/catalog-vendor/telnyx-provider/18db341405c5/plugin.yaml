# Duckwork Agent plugin manifest.
#
# `kind: model-provider` routes this package to the providers/ discovery
# system: Duckwork imports `__init__.py` (which calls `register_provider`)
# from the flat `$DUCKWORK_HOME/plugins/<name>/` install location. The general
# PluginManager records the manifest but never imports the module.
manifest_version: 1
name: telnyx-provider
kind: model-provider
version: 0.1.0
description: Telnyx — OpenAI-compatible inference, hosted open models + frontier routes
author: Telnyx
homepage: https://github.com/DuckMind/duckwork
requires_duckwork: ">=0.21.4"
requires_env:
  - name: TELNYX_API_KEY
    description: Telnyx API key (v2)
    url: https://portal.telnyx.com/#/app/api-keys
    secret: true
