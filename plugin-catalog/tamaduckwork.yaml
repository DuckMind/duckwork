description: >-
  Grow a local TamaDuckwork pet from real Duckwork agent activity. Disclosure — hooks write a pet ledger and sprite atlas under $DUCKWORK_HOME only; the optional python -m tamaduckwork CLI additionally reads/writes ~/.codex, ~/.petdex and ~/.evopet, runs an unauthenticated loopback preview server (127.0.0.1:8765) and on macOS compiles a Swift overlay and installs a RunAtLoad+KeepAlive LaunchAgent with no uninstall command. No network egress, no credential reads.
