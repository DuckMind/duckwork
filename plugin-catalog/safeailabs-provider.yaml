description: "Safe AI Labs as a Duckwork model provider (`--provider safeailabs`, or Safe AI Labs in `duckwork model`): an OpenAI-compatible API with one endpoint per region, the model list from its /v1/models and the context window of its fallback model declared. Disclosure — registers one model provider at import and nothing else (no tools, hooks, commands or threads); chat requests and the model list go to https://us.api.safeailabs.ai/v1 (or SAFE_AI_BASE_URL) through Duckwork' own client with SAFE_AI_KEY, which Duckwork reads; the plugin itself opens no connections, reads and writes no files and starts no processes."
