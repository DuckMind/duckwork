name: boardstate
title: Boardstate
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "A live board your agent builds for you: tabs of notes, tables, charts, KPI cards and live Duckwork data, in the dashboard and Duckwork Desktop. It appears as a Board tab in the dashboard and a page in Desktop, and the agent lays it out with 19 native boardstate_* tools, approval widgets included. Runs a local Node >= 20 sidecar on loopback with a per-spawn nonce; no network access unless you opt in to operator-gated connectors. Disclosure — spawns a local Node.js ≥20 sidecar (from PATH/DUCKWORK_NODE_BIN, nothing downloaded) on 127.0.0.1 on first use; state under DUCKWORK_HOME/boardstate-state/. Reads the dashboard's loopback session token from Duckwork internals (web_server._SESSION_TOKEN) and passes it to the sidecar for live usage/sessions/cron widgets; mounts one token-gated static route for approved widget assets. No outbound network unless you author boardstate.connectors.json (stdio/HTTP MCP connectors); connector actions need operator approval. Ships one plugin skill, boardstate:boardstate-report-problem, which drafts a bug report and files it with the GitHub CLI only after the user approves the exact text."
maintainer: Fordex
