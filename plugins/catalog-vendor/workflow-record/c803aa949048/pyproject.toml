[project]
name = "duckwork-workflow-record"
version = "0.1.0"
description = "duckwork record: demonstrate a browser workflow once, replay it as a Duckwork skill"
requires-python = ">=3.11"
# CDP client for the live recorder. Duckwork core already ships websockets 15.x;
# declared so the installer and CI resolve it explicitly.
dependencies = [
  "websockets>=15,<16",
]
