description: "Your company's memory in Duckwork: search decisions, people, customers and projects across every source your team connected to Gurusup (Slack, HubSpot, Notion, uploaded documents and more), with the sources behind each answer. Portable Agent Plugins v1 package (mcp.json + skills/), remote streamable-http with OAuth 2.1, no local code and no API keys. Disclosure — hosted-only MCP connector with no local code: every tool call goes to Gurusup's server at mcp.brain.gurusup.com under the signed-in Gurusup account (OAuth via `duckwork mcp add gurusup-brain --url https://mcp.brain.gurusup.com/mcp --auth oauth`; the bundled mcp.json alone yields 401), and answers are limited to what that account can see; write tools save knowledge to the company's Gurusup workspace (add_company_knowledge, skills_publish) and send issue reports or feedback to Gurusup (report_issue, send_feedback), and request_human_info can message a teammate on Slack or phone them when its dispatch flag is set."
