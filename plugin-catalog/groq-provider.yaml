description: >-
  Groq as a Duckwork model provider (`--provider groq`, or Groq in `duckwork model`): reasoning effort is sent in the form each Groq model accepts, so gpt-oss-120b and gpt-oss-20b work (through a custom endpoint, Duckwork 0.21.5 sends them a value Groq rejects with HTTP 400), and the model list leaves out Groq's speech-to-text, text-to-speech, prompt-guard and 4K-context models that Duckwork cannot run. Not affiliated with Groq. Disclosure — registers one model provider at import and nothing else (no tools, hooks, commands or threads); chat requests and the model list go to https://api.groq.com/openai/v1 (or the configured model.base_url) through Duckwork' own client with GROQ_API_KEY, which Duckwork reads; the plugin itself opens no connections, reads and writes no files and starts no processes.
