description: "Share Duckwork Desktop conversations as long PNG screenshots, self-contained HTML, or Markdown — per-turn selection, turn gutter, search, per-turn collapsing and session metadata. The Duckwork Desktop counterpart of dsh-share. Disclosure — makes no network calls; reads the conversation you share (and the session list, for its title) through the gateway's session.history / session.info / session.list RPCs; writes to the clipboard or downloads a file only when you trigger an export. HTML exports keep the conversation's image and link URLs, which load when the file is opened."
