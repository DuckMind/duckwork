name: "effortless-duckwork"
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Picks the reasoning effort for every prompt: a fast judge (Jev/TypeSafe, a local OpenAI-compatible model, or any custom API) reads the next message once per turn and rewrites the request's reasoning effort before it ships — easy questions run cheap, hard jobs get high. Port of effortless for Claude Code. Disclosure — sends the next message (≤4000 chars) plus a short recent-conversation excerpt (≤1600 chars) to the configured judge endpoint (default api.typesafe.ai for Jev; a local or custom OpenAI-compatible API otherwise), solely to pick the effort; the optional model_map setting (off by default) also switches the turn's model to the one you map to the verdict; keeps recent per-turn token counts in its own plugin state; no telemetry; secrets resolved only through Duckwork' secret scope; stdlib-only, no pip dependencies."
