title: Web Crawler Spider
description: "A small spider that lives on the Duckwork Desktop window: a web that grows with tool calls, helper spiders for subagents, an amber mood while Duckwork waits for approval, spider-sense for risky commands, flies, napping. By default it roams only its own overlay and reads nothing from the app; walking between the app's real buttons and links is an opt-in setting (off by default). Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware or env vars. Disclosure — draws an animated overlay on the Desktop window and reads gateway events (tool runs, subagents, approval waits, risky-command flags) and the app's theme colours; the opt-in \"Explore the app\" setting (off by default) also scans the window's buttons, links and alert banners, including button labels, to walk to them."
