# This repo is a Duckwork directory plugin (installed with `duckwork plugins install`), not a
# pip package. [project].dependencies is what Duckwork installs for the plugin: it is empty
# on purpose — httpx is already a core Duckwork dependency.
[project]
name = "duckwork-whatsapp-agent-platform"
version = "0.2.0"
description = "Meta WhatsApp Agent Platform adapter for Duckwork Agent"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Duckwork itself is installed separately from git (PyPI duckwork-agent is outdated).
test = ["pytest==9.1.1", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-p no:cacheprovider --import-mode=importlib"
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
