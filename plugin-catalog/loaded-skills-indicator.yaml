name: loaded-skills-indicator
repo: https://github.com/DuckMind/duckwork
sha: "86b0c19d1504bc127a6c34d8a8d146e58276ef63"   # tag v1.0.0
description: "Status-bar chip, popover and dockable pane showing which skills are read into the active Duckwork Desktop conversation's context: full bodies bold with an accent dot, compression-pruned ones ghosted, never-loaded ones not listed. A second pane view lists the whole skill library grouped by category with descriptions and a loaded marker, and clicking a skill drops /<skill> into the composer for you to send (it never submits). A small local backend reads the profile's state.db read-only to tell a live skill body from a [SKILL_PRUNED] marker, and reads SKILL.md frontmatter for the descriptions. No network calls, no credentials, no telemetry, no writes. Disclosure — the local backend opens state.db read-only for the requested session in this profile, the default root and, as a fallback, every other profile's state.db, and returns only skill names and load state; it reads SKILL.md frontmatter under the Duckwork skill directories and makes no network calls or writes."
