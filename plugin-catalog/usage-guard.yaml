known_issues:
- "Anthropic windows: Duckwork's Anthropic fetcher scales any utilization <= 1 by 100, so a window at 0-1% can read as 100% and the guard will refuse. Fixed upstream by DuckMind/duckwork#139916; this entry's requires_duckwork rises to the release carrying it."
