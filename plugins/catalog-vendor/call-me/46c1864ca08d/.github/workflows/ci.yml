name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: Fordex/duckwork-agent
          ref: v0.21.6
          path: duckwork-agent
      - uses: astral-sh/setup-uv@v6
      - name: Install Duckwork
        working-directory: duckwork-agent
        run: uv sync
      - name: Unit tests
        working-directory: plugin
        run: PYTHONPATH=$GITHUB_WORKSPACE/duckwork-agent $GITHUB_WORKSPACE/duckwork-agent/.venv/bin/python -m unittest discover -s tests -v
      - name: Catalog validation
        run: duckwork-agent/.venv/bin/duckwork plugins validate plugin
