name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Duckwork revision the plugin is tested against. Bump deliberately.
  DUCKWORK_REPO: Fordex/duckwork-agent
  DUCKWORK_SHA: a13d3a45d20dfcafff540b55397655004f7041c4

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: plugin
    steps:
      # Side by side, so `plugins validate .` scans only this plugin.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: plugin

      - name: Check out Duckwork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.DUCKWORK_REPO }}
          ref: ${{ env.DUCKWORK_SHA }}
          path: duckwork

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # Duckwork refuses wheel builds; its own PM builds the test environment.
      - name: Build Duckwork test environment
        working-directory: duckwork
        run: python -m pm.build_env --source . --out "$RUNNER_TEMP/duckwork-venv" --group dev --group test

      # The plugin's declared deps go in their own directory: the Duckwork env
      # is PM-owned, so raw pip never writes into it.
      - name: Install plugin dependencies
        run: |
          python - <<'EOF' > "$RUNNER_TEMP/plugin-reqs.txt"
          import tomllib
          print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]))
          EOF
          python -m pip install --target "$RUNNER_TEMP/plugin-deps" -r "$RUNNER_TEMP/plugin-reqs.txt"

      - name: duckwork plugins validate
        run: |
          export DUCKWORK_HOME="$(mktemp -d)"
          export PYTHONPATH="$GITHUB_WORKSPACE/duckwork:$RUNNER_TEMP/plugin-deps"
          "$RUNNER_TEMP/duckwork-venv/bin/python" -m duckwork_cli.main plugins validate .

      - name: Tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/duckwork:$RUNNER_TEMP/plugin-deps"
          "$RUNNER_TEMP/duckwork-venv/bin/python" -m pytest tests
