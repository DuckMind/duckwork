description: >-
  Native BYOK Soniox text-to-speech and asynchronous speech-to-text providers with configurable languages and voices, automatic STT language detection, and Duckwork voice-bubble support. Disclosure — TTS sends reply text and synthesis settings to tts-rt.soniox.com; STT uploads audio, optional language hints, and optional prompt context to api.soniox.com, then best-effort deletes the remote transcription and uploaded file. SONIOX_API_KEY is resolved through Duckwork' active-profile secret scope. No telemetry, shell commands, background processes, or stored credentials.
maintainer: Fordex
tier: community
version: "0.2.0"
category: voice
requires_duckwork: ">=0.22.4"
