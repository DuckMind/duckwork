description: "@crontab: context references that explain a cron expression for the model: @crontab:\"0 9 * * 1-5\" (or a shortcut such as @crontab:@daily) attaches a plain-words reading (\"At 09:00 on Monday through Friday.\"), each field on its own row, whether Duckwork's /cron takes it as a cron expression (shortcuts, ? and 5#3 are not), its next five runs in Duckwork's timezone setting worked out the way cron/jobs.py computes next runs, and notes on day of month OR day of week, * in the minute field, steps that do not divide the hour or day, days 29-31 and 7 as Sunday; the TUI and Desktop composer suggest examples and preview an expression as you type it. The reading comes from croniter, the library Duckwork's scheduler uses. Disclosure — reads only the text of the reference itself, the system clock and Duckwork's timezone setting (DUCKWORK_TIMEZONE, else timezone from the loaded config through duckwork_cli.config), using croniter (already installed with Duckwork) and Python's standard library; no network, no files read or written, no subprocess, no credentials read, no cron job created, changed or run; the @crontab: reference and its explanation become part of the message sent to your model provider and saved in the session history; register() only adds the @crontab: reference provider."
