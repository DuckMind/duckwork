description: >-
  LowRouter as a Duckwork model provider (`--provider lowrouter`, or LowRouter in `duckwork model`). The picker shows the 180 `auto/` chat models with tool calling and 64K+ context, plus the user's own `alias/` models, instead of all 719 IDs from /v1/models. Context windows come from LowRouter's catalog instead of Duckwork' 256K fallback, and /usage shows the credit balance in euros. LowRouter bills in EUR, so the plugin reports no USD cost and Duckwork shows it as unknown. Maintained by LowRouter. Disclosure — registers one model provider and nothing else (no tools, hooks, commands or threads). Prompts, tool schemas and LOWROUTER_API_KEY go to https://api.lowrouter.ai/v1 (or the configured model.base_url) through Duckwork' client, and LowRouter forwards each request to the host serving the model. The plugin's own requests are GET /v1/models (cached for an hour) and GET /v1/credits on /usage, to the same base URL with the same key, through Duckwork' open_credentialed_url. No files read or written, no processes.
