name: call-me
title: /call-me
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "/call-me gateway: text your Duckwork agent from the /call-me iPhone app, and the callme_call tool rings your phone, speaks the agent's text and returns your spoken answer as a transcript. Disclosure — talks only to the /call-me service at https://callmemcp.com/aiphone (run by the plugin author): creates one agent session, sends texts and call requests, and long-polls for replies while the gateway runs (at most one request every 3 seconds); sends message text, the text to be spoken and the destination numbers, and call audio is transcribed by the service so only the transcript comes back; the agent session token and event cursor are stored at $DUCKWORK_HOME/plugin-data/call-me/session.json (mode 600); only numbers in CALLME_ALLOWED_USERS can message the agent or be called, and inbound messages must come from that number's verified /call-me device; callme_call blocks until the call ends (300 seconds at most) and returns missed if nobody answers; no shell commands, telemetry or self-update. The /call-me iPhone app that receives the messages and calls needs a paid subscription; the plugin itself is free and MIT-licensed."
maintainer: Fordex
tier: community
category: platform
requires_duckwork: ">=0.21.5"
version: "0.1.0"
