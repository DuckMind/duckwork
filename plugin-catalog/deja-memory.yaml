description: "Memory from the coding sessions already on this machine — Claude Code, Codex, Cursor, Duckwork and the other agents deja reads, including history from before it was installed. No model, no API key, no server. Disclosure — runs the separately installed, unpinned deja binary (brew install deja-vu) as a subprocess; deja reads Claude Code, Codex, Cursor, Duckwork and other agents' local transcript files, keeps its index under ~/.cache/deja, and recalled text from those agents is injected into Duckwork turns; nothing leaves the machine."
