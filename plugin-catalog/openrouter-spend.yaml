name: openrouter-spend
title: "OpenRouter Spend"
repo: https://github.com/DuckMind/duckwork
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "OpenRouter API-key spend and recorded chat costs in USD/INR. Disclosure — sends the configured OpenRouter key (OPENROUTER_API_KEY, or the variable named in api_key_env) only to openrouter.ai's read-only key and generation accounting endpoints, and fetches public USD/INR rates from api.frankfurter.dev unless a manual rate is set; middleware on every LLM request records ids, model, token counts and reported cost (no prompt or reply text) to its own ledger; the dashboard reads accounting metadata (session ids, token counts, billing provider) read-only from the state.db and OpenRouter Spend ledger of every profile under the Duckwork root."
maintainer: Fordex
tier: community
category: desktop
version: "0.4.1"
requires_duckwork: ">=0.21.5"
