description: "Web search and page fetching through Keenable's hosted MCP server, with search and research skills: single-site and publish-date filters, result and snippet limits, and page fetches that return only what a prompt asks for. Works without an API key; an optional KEENABLE_API_KEY lifts the keyless rate limits. Adds direct MCP tools beside Duckwork's built-in Keenable web backend and leaves web_search / web_extract provider selection unchanged. Disclosure: connects to Keenable's hosted MCP server at `api.keenable.ai` and sends it the search queries, URLs and fetch prompts the agent issues, labelled with the header `X-Keenable-Title: duckwork-plugin`; sends `X-API-Key` only when the user adds the optional config.yaml entry with their key."
