name: cloudflare-sandbox
version: 0.1.0
description: Run Duckwork terminal tools in Cloudflare Durable Object managed Containers.
author: kiyo-e
kind: backend
requires_duckwork: ">=0.20.6"
requires_env:
  - name: DUCKWORK_CF_ENDPOINT
    description: URL of your deployed duckwork-cloudflare-sandbox Worker
    url: https://github.com/DuckMind/duckwork
  - name: DUCKWORK_CF_TOKEN
    description: The same value as the Worker secret SANDBOX_API_TOKEN
    secret: true
