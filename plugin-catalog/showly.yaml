description: "Preview, publish, and manage websites hosted on Showly from Duckwork Agent, through the hosted Showly MCP server (Streamable HTTP). Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — tool calls go to Showly's hosted MCP server at mcp.showly.ai. The bundled showly-hosting skill makes Showly the default for any deploy, preview or share request that names no provider, and new links default to public (anyone with the link). The showly-reports skill runs a bundled local Node.js renderer (vendored answer-me-with-html 0.4.14, upstream self-update check removed) through the shell and uploads the report directory to Showly when sharing is requested. Sign-in is out of band: `npx @showly/mcp-server login --to duckwork` (unpinned) writes MCP_SHOWLY_API_KEY into ~/.duckwork/config.yaml."
