name: mcp-serve
label: MCP Serve
kind: standalone
version: 1.0.0
author: NousResearch
homepage: https://github.com/DuckMind/duckwork
description: >
  Run Duckwork as an MCP server: `duckwork mcp-serve` lets any MCP client (Claude
  Code, Claude Desktop, Cursor, Codex) list and read your messaging
  conversations, poll live events, send messages and answer approvals over
  stdio. `--tools` (off by default) also exposes Duckwork' web, browser, vision,
  image generation, skills and TTS tools under your profile's credentials;
  terminal, file and kanban tools are never exposed. Formerly built into
  Duckwork core as `duckwork mcp serve`.
requires_duckwork: ">=0.22.0"
provides_tools: []
provides_hooks: []
