description: 'Langfuse observability for Duckwork: one trace per turn, one generation per LLM call (usage and cost from Duckwork'' own pricing, cache and reasoning tokens included), one observation per tool call and subagent. Content capture is sanitized by default (metadata-only and full are opt-in); sends traces only to the Langfuse project whose keys you set. Formerly built into Duckwork core as observability/langfuse; existing users are migrated automatically.'
maintainer: "Fordex"
tier: official
category: general
requires_duckwork: ">=0.21.7"
version: "2.0.0"
image: "https://github.com/DuckMind/duckwork/raw/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/langfuse/6d53a93ef0c4/_catalog_assets/assets/langfuse.jpg"
