<style>
html.dsu-lock,html.dsu-lock body{overflow:hidden!important}
#duckwork-startup-root.dsu-boot{position:fixed;inset:0;z-index:2147483000;background:#000}
/* ============================================================================
 * duckwork-boot-screen — boot screen / startup animation styles
 * ----------------------------------------------------------------------------
 * The look follows the reference clip (a Hypergryph-style boot sequence):
 * black prologue -> grey-white overexposed wash -> warm-white "technical
 * dossier" backdrop -> letter-spaced monospace status line -> ring reticle
 * sweep -> WELCOME lockup -> chromatic-aberration glitch.
 *
 * Every font is a system font, so there is zero network dependency:
 *   --dsu-din   Bahnschrift (DIN 1451 flavour, shipped with Windows 10+; stands
 *               in for the narrow technical type of "RHINE LAB / SYNTHESIZE
 *               INFORMATION" in the reference clip)
 *   --dsu-mono  Cascadia Mono / Consolas (the letter-spaced monospace captions)
 *   --dsu-zh    Microsoft YaHei (the small Chinese subtitles along the bottom)
 * ========================================================================== */

#duckwork-startup-root,
#duckwork-startup-root *,
#duckwork-startup-root *::before,
#duckwork-startup-root *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

#duckwork-startup-root {
  /* —— Palette (light theme / reference-clip colours) —— */
  --dsu-bg: #e5e3df;
  --dsu-bg-2: #eceae6;
  --dsu-ink: #0a0a0a;
  --dsu-ink-soft: #3a3936;
  --dsu-muted: #7a7873;
  --dsu-hair: rgba(10, 10, 10, 0.16);
  --dsu-hair-soft: rgba(10, 10, 10, 0.07);
  --dsu-accent: #ff7500;
  --dsu-glitch-a: #ff3b30;
  --dsu-glitch-b: #2971b8;
  --dsu-box-bg: #0a0a0a;
  --dsu-box-ink: #ffffff;
  --dsu-sub-glow: 0 0 6px rgba(255, 255, 255, 0.9);

  /* All fonts come from the system; no webfont is shipped, so the boot has zero
   FOUT. Three-tier fallback chains cover Win / macOS / Linux:
     narrow DIN-style display: Bahnschrift(Win) -> DIN Alternate(macOS) -> Ubuntu/Roboto Condensed(Linux)
     monospace: Cascadia Mono(Win) -> SFMono/Consolas -> DejaVu Sans Mono(Linux)
     CJK: Microsoft YaHei(Win) -> PingFang(macOS) -> Source Han/Noto/WQY(Linux)
   With none of them present we fall back to generic sans-serif — the layout is
   unchanged, only the glyph shapes look slightly different. */
  --dsu-din: "Bahnschrift", "DIN Alternate", "DIN Condensed", "Archivo", "Oswald",
    "Arial Narrow", "Liberation Sans Narrow", "Ubuntu Condensed", "Roboto Condensed",
    "Noto Sans Display", "HarmonyOS Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  --dsu-mono: "Cascadia Mono", "SFMono-Regular", "Consolas", "Menlo", "DejaVu Sans Mono",
    "Liberation Mono", "Noto Sans Mono", ui-monospace, monospace;
  --dsu-zh: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "HarmonyOS Sans SC",
    "Source Han Sans SC", "Noto Sans CJK SC", "Noto Sans SC", "WenQuanYi Micro Hei",
    sans-serif;

  --dsu-speed: 1;

  position: fixed;
  inset: 0;
  z-index: 2147483000;
  overflow: hidden;
  background: #000;
  color: var(--dsu-ink);
  font-family: var(--dsu-din);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  cursor: default;
  -webkit-user-select: none;
  user-select: none;
  contain: layout paint style;
}

/* Per-character fade-in (typeIn): opacity instead of clipping, so centred lines never jitter sideways */
.dsu-status .dsu-ch,
.dsu-sub-en .dsu-ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(0.16em);
  transition: opacity 340ms ease, transform 340ms ease;
}
.dsu-sub-en .dsu-ch { transform: translateY(0.1em); transition-duration: 300ms; }
.dsu-status.dsu-in .dsu-ch,
.dsu-sub-en.dsu-in .dsu-ch { opacity: 1; transform: none; }

/* The centre logo and the final-curtain logo both take the current text colour */
.dsu-logo svg,
.dsu-w3 svg { fill: currentColor; }

/* Dark theme: the same layout over a dark backdrop */
#duckwork-startup-root.dsu-dark {
  --dsu-bg: #0b0b0c;
  --dsu-bg-2: #131315;
  --dsu-ink: #f2f1ee;
  --dsu-ink-soft: #cfcecb;
  --dsu-muted: #85847f;
  --dsu-hair: rgba(255, 255, 255, 0.18);
  --dsu-hair-soft: rgba(255, 255, 255, 0.07);
  --dsu-box-bg: #f2f1ee;
  --dsu-box-ink: #0b0b0c;
  --dsu-sub-glow: 0 0 6px rgba(0, 0, 0, 0.9);
  background: #000;
}

/* First-paint fallback: cover the whole window before the script runs, so the app itself never flashes through */
#duckwork-startup-root.dsu-boot::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #000;
  z-index: 90;
}

#duckwork-startup-root.dsu-gone {
  opacity: 0;
  pointer-events: none;
  transition: opacity 620ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Backdrop ────────────────────────────────────────────────────────── */
.dsu-plate {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 90% at 78% 12%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 55%),
    linear-gradient(168deg, var(--dsu-bg-2) 0%, var(--dsu-bg) 42%, var(--dsu-bg) 100%);
  opacity: 0;
}

.dsu-dark .dsu-plate {
  background:
    radial-gradient(120% 90% at 78% 12%, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0) 55%),
    linear-gradient(168deg, var(--dsu-bg-2) 0%, var(--dsu-bg) 42%, var(--dsu-bg) 100%);
}

/* The barely-there dossier panels in the background (the very faint cluster of blocks on the right of the reference clip) */
.dsu-watermark {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}
.dsu-wm {
  position: absolute;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
  border: 1px solid var(--dsu-hair-soft);
}
.dsu-dark .dsu-wm {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0));
}

/* Fine grain, so large colour fields do not look like "plastic" */
.dsu-grain {
  position: absolute;
  inset: -50%;
  opacity: 0.05;
  transition: opacity 300ms ease;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.6'/></svg>");
}

/* ── Act one: black screen + Duckwork logo ───────────────────────────── */
.dsu-black {
  position: absolute;
  inset: 0;
  background: #000;
  display: grid;
  place-items: center;
  z-index: 40;
  opacity: 1;
}
.dsu-black-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 560ms ease, transform 560ms ease;
}
.dsu-black-inner.dsu-in {
  opacity: 1;
  transform: none;
}
.dsu-black-inner.dsu-out {
  opacity: 0;
  transform: scale(1.045);
  transition: opacity 620ms ease, transform 620ms ease;
}
.dsu-whale {
  display: block;
  fill: currentColor;
}
.dsu-black .dsu-whale {
  width: 122px;
  height: 122px;
  color: #fff;
  margin-bottom: 18px;
}
.dsu-black-zh {
  font-family: var(--dsu-zh);
  font-size: 33px;
  font-weight: 700;
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  color: #fff;
}
.dsu-black-en {
  margin-top: 9px;
  font-family: var(--dsu-din);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 0.62em;
  text-indent: 0.62em;
  color: #fff;
  transition: letter-spacing 1300ms cubic-bezier(0.16, 0.84, 0.24, 1);
}
.dsu-black-en.dsu-tighten {
  letter-spacing: 0.2em;
  text-indent: 0.2em;
}
.dsu-black-sub {
  margin-top: 12px;
  font-family: var(--dsu-mono);
  font-size: 10px;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  color: rgba(255, 255, 255, 0.5);
}
/* Light sweep: a very faint white band passes across the logo */
.dsu-sweep {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 42%;
  left: -50%;
  background: linear-gradient(
    100deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.055) 42%,
    rgba(255, 255, 255, 0.12) 50%,
    rgba(255, 255, 255, 0.055) 58%,
    rgba(255, 255, 255, 0) 100%
  );
  pointer-events: none;
}
.dsu-sweep.dsu-go {
  animation: dsu-sweep 1150ms cubic-bezier(0.32, 0, 0.2, 1) forwards;
}
@keyframes dsu-sweep {
  from { left: -50%; }
  to { left: 118%; }
}

/* Overexposed wash: black -> grey -> white -> backdrop */
.dsu-wash {
  position: absolute;
  inset: 0;
  background: #8b8a88;
  opacity: 0;
  z-index: 35;
  pointer-events: none;
}
.dsu-flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  z-index: 60;
  pointer-events: none;
}

/* ── Brand block (top left) ──────────────────────────────────────────── */
/* Once the black screen ends everything "slides into place": left-hand text enters
   from -22px, right-hand elements from +18px, staggered 60ms apart; no more
   clip-style wipe */
.dsu-brand {
  position: absolute;
  left: 46px;
  top: 44px;
  z-index: 20;
  color: var(--dsu-ink);
}
.dsu-brand-1,
.dsu-brand-2,
.dsu-brand-3 {
  opacity: 0;
  transform: translateX(-22px);
  transition: opacity 560ms cubic-bezier(0.16, 0.84, 0.24, 1),
    transform 560ms cubic-bezier(0.16, 0.84, 0.24, 1);
}
.dsu-brand-1 {
  font-size: 33px;
  font-weight: 700;
  letter-spacing: 0.012em;
  line-height: 0.98;
}
.dsu-brand-2 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.012em;
  margin-top: 3px;
}
.dsu-brand-3 {
  font-size: 30px;
  font-weight: 400;
  line-height: 1.06;
  letter-spacing: 0.012em;
  display: flex;
  align-items: baseline;
  gap: 9px;
}
.dsu-brand-3 b { font-weight: 700; }
.dsu-brand.dsu-in .dsu-brand-1 { opacity: 1; transform: none; transition-delay: 60ms; }
.dsu-brand.dsu-in .dsu-brand-2 { opacity: 1; transform: none; transition-delay: 150ms; }
.dsu-brand.dsu-in .dsu-brand-3 { opacity: 1; transform: none; transition-delay: 240ms; }

/* Centre status area */
.dsu-center {
  position: absolute;
  left: 0;
  right: 0;
  top: 47%;
  transform: translateY(-50%);
  z-index: 22;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  pointer-events: none;
  transition: opacity 340ms ease;
}
/* At the final curtain the whole centre block (status line / rule / whale / dotted
   line) must leave as one, otherwise it collides with the WELCOME lockup */
.dsu-center.dsu-off { opacity: 0; }

.dsu-status {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--dsu-din);
  font-size: 44px;
  font-weight: 400;
  letter-spacing: 0.14em;
  color: var(--dsu-ink);
  opacity: 0;
  transition: opacity 300ms ease;
  white-space: nowrap;
}
.dsu-status.dsu-in { opacity: 1; }
.dsu-status.dsu-zhline {
  font-family: var(--dsu-zh);
  font-weight: 400;
  letter-spacing: 0.22em;
  text-indent: 0.22em;
  font-size: 40px;
}
.dsu-caret {
  display: inline-block;
  width: 15px;
  height: 4px;
  background: var(--dsu-accent);
  transform: translateY(3px);
  opacity: 0;
}
.dsu-caret.dsu-on {
  opacity: 1;
  animation: dsu-blink 1s steps(1, end) infinite;
}
@keyframes dsu-blink { 50% { opacity: 0; } }

.dsu-sub-en {
  margin-top: 14px;
  font-family: var(--dsu-mono);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.44em;
  text-indent: 0.44em;
  color: var(--dsu-ink-soft);
  opacity: 0;
  white-space: nowrap;
}
.dsu-sub-en.dsu-in { opacity: 1; }

.dsu-rule {
  margin-top: 22px;
  height: 1px;
  width: 0;
  background: var(--dsu-hair);
  transition: width 620ms cubic-bezier(0.2, 0.9, 0.2, 1);
}
.dsu-rule.dsu-in { width: min(560px, 42vw); }

/* Centre logo (whale) assembly area */
.dsu-logo {
  margin-top: 26px;
  height: 0;
  opacity: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: opacity 420ms ease, height 420ms ease, margin-top 420ms ease;
}
.dsu-logo.dsu-in {
  opacity: 1;
  height: 118px;
}
.dsu-logo svg {
  width: 84px;
  height: 84px;
  color: var(--dsu-ink);
}
.dsu-logolabel {
  margin-top: 10px;
  font-family: var(--dsu-mono);
  font-size: 10px;
  letter-spacing: 0.58em;
  text-indent: 0.58em;
  color: var(--dsu-ink-soft);
}
.dsu-dots {
  margin-top: 9px;
  height: 2px;
  width: 96px;
  background-image: radial-gradient(circle, var(--dsu-ink) 40%, transparent 42%);
  background-size: 12px 2px;
  background-repeat: repeat-x;
  opacity: 0.5;
}

/* Right-hand monospace info line (matches the reference clip's "· ID CONFIRMED : JOYC") */
.dsu-idline {
  position: absolute;
  left: calc(50% + 190px);
  top: 49%;
  transform: translateY(-50%) translateX(16px);
  z-index: 22;
  font-family: var(--dsu-mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--dsu-ink-soft);
  opacity: 0;
  transition: opacity 520ms ease, transform 520ms cubic-bezier(0.16, 0.84, 0.24, 1);
  transition-delay: 520ms;
  white-space: nowrap;
}
.dsu-idline.dsu-in { opacity: 1; transform: translateY(-50%); }

/* ── Ring reticle (verification passed) ──────────────────────────────── */
/* Straight from the original: the ring is centred with a diameter of roughly 56vw
   and the status text sits in its heart, the two read as one object. The key is
   keeping the gap of both arc segments at 6 o'clock straight down, so the
   bottom subtitles are never covered. */
.dsu-reticle {
  position: absolute;
  left: 50%;
  top: 45%;
  width: min(56vw, 86vh, 1040px);
  height: min(56vw, 86vh, 1040px);
  transform: translate(-50%, -50%);
  z-index: 16;
  opacity: 0;
  transition: opacity 500ms ease;
  pointer-events: none;
}
.dsu-reticle.dsu-in { opacity: 1; }
.dsu-reticle svg { width: 100%; height: 100%; overflow: visible; }
.dsu-ret-rot-a { transform-origin: 50% 50%; animation: dsu-spin 9s linear infinite; }
.dsu-ret-rot-b { transform-origin: 50% 50%; animation: dsu-spin 5.4s linear infinite reverse; }
@keyframes dsu-spin { to { transform: rotate(360deg); } }
.dsu-reticle .dsu-ring-a { fill: none; stroke: var(--dsu-ink); stroke-width: 6; }
.dsu-reticle .dsu-ring-b { fill: none; stroke: var(--dsu-box-ink); stroke-width: 2.2; opacity: 0.95; }
.dsu-reticle .dsu-dot-a { fill: var(--dsu-ink); }
.dsu-reticle .dsu-dot-b { fill: var(--dsu-box-ink); }
.dsu-reticle .dsu-dot-o { fill: var(--dsu-accent); }
.dsu-reticle .dsu-bracket {
  fill: none;
  stroke: var(--dsu-ink);
  stroke-width: 1.6;
  opacity: 0.85;
}

/* Hex waterfall for the read phase: placed in the emptiest upper-right area of the original, instead of crowding the centre */
.dsu-hex {
  position: absolute;
  right: 46px;
  top: 22%;
  width: 236px;
  height: 148px;
  overflow: hidden;
  z-index: 19;
  font-family: var(--dsu-mono);
  font-size: 10px;
  line-height: 1.55;
  letter-spacing: 0.06em;
  color: var(--dsu-ink-soft);
  opacity: 0;
  transition: opacity 320ms ease;
  text-align: right;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 74%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 22%, #000 74%, transparent);
}
.dsu-hex.dsu-in { opacity: 0.6; }

/* ── Interaction area ────────────────────────────────────────────────── */
.dsu-action {
  position: absolute;
  left: 0;
  right: 0;
  top: 60%;
  z-index: 26;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 320ms ease;
}
.dsu-action.dsu-in {
  opacity: 1;
  pointer-events: auto;
}
.dsu-btn {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 13px 26px;
  border: 1.5px solid var(--dsu-ink);
  background: transparent;
  color: var(--dsu-ink);
  font-family: var(--dsu-din);
  font-size: 15px;
  letter-spacing: 0.14em;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: color 220ms ease, border-color 220ms ease;
}
.dsu-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--dsu-ink);
  transform: translateX(-101%);
  transition: transform 300ms cubic-bezier(0.2, 0.9, 0.2, 1);
}
.dsu-btn:hover::before { transform: none; }
.dsu-btn:hover { color: var(--dsu-box-ink); }
.dsu-btn:hover .dsu-btn-en { color: var(--dsu-box-ink); opacity: 1; }
.dsu-btn > * { position: relative; z-index: 1; }
.dsu-btn:active { transform: translateY(1px); }
.dsu-btn-zh { font-family: var(--dsu-zh); font-weight: 500; }
.dsu-btn-en { font-family: var(--dsu-mono); font-size: 11px; letter-spacing: 0.24em; opacity: 0.62; }
.dsu-btn.dsu-pulse { animation: dsu-pulse 1.9s ease-in-out infinite; }
@keyframes dsu-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 117, 0, 0); }
  50% { box-shadow: 0 0 0 7px rgba(255, 117, 0, 0.14); }
}
.dsu-hint {
  font-family: var(--dsu-zh);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--dsu-muted);
}
.dsu-hint kbd {
  font-family: var(--dsu-mono);
  border: 1px solid var(--dsu-hair);
  padding: 1px 5px;
  margin: 0 3px;
  font-size: 10px;
  letter-spacing: 0.06em;
}

/* Identity card (step two): plain Chinese labels plus numbers, with the bilingual duplication and vertical table headers dropped to keep it clean */
.dsu-card {
  display: flex;
  flex-direction: column;
  gap: 0;
  min-width: 300px;
  padding: 2px 0;
  border-top: 1px solid var(--dsu-hair);
  border-bottom: 1px solid var(--dsu-hair);
}
/* display:flex in the author styles overrides the UA display:none of [hidden], so an
   explicit rule is required — otherwise step one (button only, no card) would
   show an empty border */
.dsu-card[hidden] { display: none; }
.dsu-card-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 34px;
  padding: 8px 2px;
  font-family: var(--dsu-zh);
  font-size: 12.5px;
  letter-spacing: 0.14em;
  color: var(--dsu-muted);
}
.dsu-card-row + .dsu-card-row {
  border-top: 1px solid var(--dsu-hair-soft);
}
.dsu-card-row b {
  font-family: var(--dsu-din);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.08em;
  color: var(--dsu-ink);
}
.dsu-card-row b.dsu-zhname { font-family: var(--dsu-zh); letter-spacing: 0.1em; }

/* ── Final curtain: WELCOME ──────────────────────────────────────────── */
.dsu-welcome {
  position: absolute;
  left: 0;
  right: 0;
  top: 45%;
  transform: translateY(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 420ms ease;
}
.dsu-welcome.dsu-in { opacity: 1; }
.dsu-w1 {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  color: var(--dsu-ink);
}
.dsu-w2 {
  margin-top: 12px;
  background: var(--dsu-box-bg);
  color: var(--dsu-box-ink);
  padding: 7px 16px 8px;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-indent: 0.12em;
}
.dsu-w3 {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.dsu-w3 svg { width: 76px; height: 76px; color: var(--dsu-ink); }
.dsu-w3 span {
  font-family: var(--dsu-mono);
  font-size: 10px;
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  color: var(--dsu-ink-soft);
}
.dsu-w4 {
  margin-top: 20px;
  font-family: var(--dsu-zh);
  font-size: 15px;
  letter-spacing: 0.28em;
  text-indent: 0.28em;
  color: var(--dsu-ink);
}

/* Chromatic-aberration glitch (the cyan-blue fringing at the end of the
   reference clip)
   How: duplicate layers with a 0.5px blur + sliced clip-path offsets + a blend
   mode, so it reads as lens dispersion rather than "three copies of the word
   stacked". At rest it must be opacity:0, otherwise the red and blue copies
   keep sitting on the text after the animation ends. */
.dsu-glitch { position: relative; }
.dsu-glitch[data-text]::before,
.dsu-glitch[data-text]::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  opacity: 0;
  pointer-events: none;
  filter: blur(0.5px);
  mix-blend-mode: multiply;      /* Light plate, dark ink: subtractive edges */
  clip-path: inset(0 0 100% 0);
}
.dsu-glitch[data-text]::before { color: var(--dsu-glitch-a); }
.dsu-glitch[data-text]::after { color: var(--dsu-glitch-b); }
/* The dark-plate / white-ink block has to switch to additive blending, otherwise multiply leaves it black */
.dsu-glitch.dsu-glitch-box::before,
.dsu-glitch.dsu-glitch-box::after { mix-blend-mode: screen; }

.dsu-glitch.dsu-on::before { animation: dsu-gx 430ms steps(3, end) 2 both; }
.dsu-glitch.dsu-on::after { animation: dsu-gy 430ms steps(3, end) 2 both; }
@keyframes dsu-gx {
  0% { transform: translate(0, 0); opacity: 0; clip-path: inset(0 0 100% 0); }
  14% { transform: translate(-3px, 0); opacity: 0.7; clip-path: inset(6% 0 68% 0); }
  34% { transform: translate(2px, 0); opacity: 0.5; clip-path: inset(54% 0 28% 0); }
  56% { transform: translate(-2px, 0); opacity: 0.6; clip-path: inset(22% 0 56% 0); }
  80% { transform: translate(1px, 0); opacity: 0.32; clip-path: inset(72% 0 10% 0); }
  100% { transform: none; opacity: 0; clip-path: inset(0 0 100% 0); }
}
@keyframes dsu-gy {
  0% { transform: translate(0, 0); opacity: 0; clip-path: inset(0 0 100% 0); }
  14% { transform: translate(3px, 0); opacity: 0.7; clip-path: inset(62% 0 14% 0); }
  34% { transform: translate(-2px, 0); opacity: 0.5; clip-path: inset(10% 0 66% 0); }
  56% { transform: translate(2px, 0); opacity: 0.6; clip-path: inset(48% 0 34% 0); }
  80% { transform: translate(-1px, 0); opacity: 0.32; clip-path: inset(30% 0 52% 0); }
  100% { transform: none; opacity: 0; clip-path: inset(0 0 100% 0); }
}

/* ── Wrap-up: radial bloom + anamorphic streak + vignette + camera pull-back  */
/* Vignette: gives the warm-white backdrop a little depth so the large fields stay flat-free */
.dsu-vignette {
  position: absolute;
  inset: 0;
  z-index: 13;
  pointer-events: none;
  opacity: 0;
  transition: opacity 900ms ease;
  background:
    radial-gradient(122% 104% at 50% 42%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.055) 100%),
    radial-gradient(60% 40% at 50% 45%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 100%);
}
.dsu-dark .dsu-vignette {
  background:
    radial-gradient(122% 104% at 50% 42%, rgba(0, 0, 0, 0) 48%, rgba(0, 0, 0, 0.42) 100%),
    radial-gradient(60% 40% at 50% 45%, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0) 100%);
}
.dsu-vignette.dsu-in { opacity: 1; }

/* Radial bloom: not a full-screen white-out, but a burst of light from the centre that keeps the warm tone at the edges */
.dsu-bloom {
  position: absolute;
  left: 50%;
  top: 45%;
  width: 128vmax;
  height: 128vmax;
  margin: -64vmax 0 0 -64vmax;
  border-radius: 50%;
  z-index: 62;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  background: radial-gradient(
    circle,
    rgba(255, 255, 255, 0.99) 0%,
    rgba(255, 255, 255, 0.94) 22%,
    rgba(255, 255, 255, 0.58) 44%,
    rgba(255, 255, 255, 0.16) 62%,
    rgba(255, 255, 255, 0) 78%
  );
}
.dsu-bloom.dsu-go { animation: dsu-bloom 1250ms cubic-bezier(0.22, 0.68, 0.2, 1) forwards; }
@keyframes dsu-bloom {
  0% { opacity: 0; transform: scale(0.08); }
  20% { opacity: 1; transform: scale(0.42); }
  58% { opacity: 0.96; transform: scale(0.96); }
  100% { opacity: 0; transform: scale(1.42); }
}

/* Anamorphic streak: a thin bar of light drawn out horizontally, sweeping through at the brightest moment of the bloom */
.dsu-streak {
  position: absolute;
  left: 50%;
  top: 45%;
  height: 3px;
  width: 0;
  z-index: 63;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%);
  filter: blur(1px);
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.5) 34%,
    rgba(255, 255, 255, 0.98) 50%,
    rgba(255, 255, 255, 0.5) 66%,
    rgba(255, 255, 255, 0) 100%
  );
}
.dsu-streak.dsu-go { animation: dsu-streak 1000ms cubic-bezier(0.2, 0.78, 0.2, 1) forwards; }
@keyframes dsu-streak {
  0% { opacity: 0; width: 0; height: 1px; }
  26% { opacity: 1; width: 62vw; height: 3px; }
  60% { opacity: 0.6; width: 96vw; height: 2px; }
  100% { opacity: 0; width: 132vw; height: 1px; }
}

/* At the brightest moment of the bloom the text picks up a cyan halo
   (halation) and the grain coarsens.
   Careful: do not put a filter on .dsu-welcome — that creates a new stacking
   context, which isolates the mix-blend-mode of the glitch layers, and the
   glitch snaps back mid-animation. */
#duckwork-startup-root.dsu-peak .dsu-w1,
#duckwork-startup-root.dsu-peak .dsu-w4 {
  color: var(--dsu-glitch-b);
  text-shadow: 0 0 14px rgba(41, 113, 184, 0.55);
  transition: color 260ms ease, text-shadow 260ms ease;
}
#duckwork-startup-root.dsu-peak .dsu-w3 svg {
  filter: drop-shadow(0 0 10px rgba(41, 113, 184, 0.45));
}
#duckwork-startup-root.dsu-peak .dsu-grain { opacity: 0.11; }

/* Curtain lift: the whole camera pulls back with a touch of defocus, which reads more like a shot than a plain fade */
#duckwork-startup-root.dsu-handoff {
  transform: scale(1.035);
  filter: blur(5px);
  opacity: 0;
  transition: opacity 780ms cubic-bezier(0.4, 0, 0.2, 1),
    transform 780ms cubic-bezier(0.4, 0, 0.2, 1), filter 780ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Footer / subtitles / progress bar ───────────────────────────────── */
.dsu-foot {
  position: absolute;
  right: 46px;
  bottom: 52px;
  z-index: 24;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--dsu-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--dsu-ink);
  opacity: 0;
  transform: translateX(18px);
  transition: opacity 560ms ease, transform 560ms cubic-bezier(0.16, 0.84, 0.24, 1);
  transition-delay: 300ms;
}
.dsu-foot.dsu-in { opacity: 1; transform: none; }
.dsu-foot i {
  display: block;
  width: 0;
  height: 7px;
  background: var(--dsu-ink);
  transition: width 720ms cubic-bezier(0.2, 0.9, 0.2, 1) 460ms;
}
.dsu-foot.dsu-in i { width: 26px; }

.dsu-subtitle {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 50px;
  z-index: 24;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
.dsu-sub-zh {
  font-family: var(--dsu-zh);
  font-size: 15px;
  letter-spacing: 0.1em;
  color: var(--dsu-ink-soft);
  text-shadow: var(--dsu-sub-glow);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 420ms ease, transform 420ms cubic-bezier(0.16, 0.84, 0.24, 1);
}
.dsu-sub-zh.dsu-in { opacity: 1; transform: none; }
.dsu-sub-en2 {
  font-family: var(--dsu-mono);
  font-size: 9.5px;
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  color: var(--dsu-muted);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 420ms ease, transform 420ms cubic-bezier(0.16, 0.84, 0.24, 1);
}
.dsu-sub-en2.dsu-in { opacity: 0.85; transform: none; }

/* Bottom progress: following the original it is trimmed to a short segment in the centre, no longer spanning the screen and competing with the subtitles */
.dsu-progress {
  position: absolute;
  left: 50%;
  bottom: 11px;
  width: min(420px, 32vw);
  height: 3px;
  transform: translateX(-50%);
  z-index: 26;
  background: var(--dsu-hair-soft);
}
.dsu-progress::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 3px;
  height: 5px;
  background-image: repeating-linear-gradient(90deg, var(--dsu-hair) 0 1px, transparent 1px 30px);
  background-size: auto 5px;
  background-position: 0 100%;
  background-repeat: repeat-x;
  opacity: 0.8;
}
.dsu-progress i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--dsu-ink);
  box-shadow: inset -2px 0 0 var(--dsu-accent);
  transition: width 460ms cubic-bezier(0.3, 0.9, 0.25, 1);
}
.dsu-progress.dsu-accent i { background: var(--dsu-accent); }

/* Step counter (bottom left) */
.dsu-stepcount {
  position: absolute;
  left: 46px;
  bottom: 52px;
  z-index: 24;
  font-family: var(--dsu-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--dsu-muted);
  opacity: 0;
  transform: translateX(-18px);
  transition: opacity 560ms ease, transform 560ms cubic-bezier(0.16, 0.84, 0.24, 1);
  transition-delay: 400ms;
}
.dsu-stepcount.dsu-in { opacity: 1; transform: none; }

/* Skip */
.dsu-skip {
  position: absolute;
  right: 46px;
  top: 48px;
  z-index: 30;
  font-family: var(--dsu-mono);
  font-size: 11px;
  letter-spacing: 0.24em;
  color: var(--dsu-muted);
  border: 1px solid transparent;
  padding: 5px 10px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 400ms ease, color 200ms ease, border-color 200ms ease;
}
.dsu-skip.dsu-in { opacity: 1; }
.dsu-skip:hover { color: var(--dsu-ink); border-color: var(--dsu-hair); }
.dsu-skip[hidden] { display: none; }

/* ── Frame decoration (original's density: hugs the edges, leaves the centre alone)  */
/* Corner registration marks / one-shot scanline / a single meta line under the brand block (with the clock) / six stage slats */
.dsu-frame {
  position: absolute;
  inset: 0;
  z-index: 17;
  pointer-events: none;
}

.dsu-corner {
  position: absolute;
  width: 16px;
  height: 16px;
  opacity: 0;
  transition: opacity 640ms ease, transform 640ms cubic-bezier(0.16, 0.84, 0.24, 1);
}
.dsu-corner::before,
.dsu-corner::after { content: ""; position: absolute; background: var(--dsu-hair); }
.dsu-corner::before { width: 100%; height: 1px; }
.dsu-corner::after { width: 1px; height: 100%; }
.dsu-c-tl { left: 26px; top: 26px; transform: translate(-10px, -10px); }
.dsu-c-tl::before { top: 0; left: 0; }
.dsu-c-tl::after { top: 0; left: 0; }
.dsu-c-tr { right: 26px; top: 26px; transform: translate(10px, -10px); }
.dsu-c-tr::before { top: 0; right: 0; }
.dsu-c-tr::after { top: 0; right: 0; }
.dsu-c-bl { left: 26px; bottom: 26px; transform: translate(-10px, 10px); }
.dsu-c-bl::before { bottom: 0; left: 0; }
.dsu-c-bl::after { bottom: 0; left: 0; }
.dsu-c-br { right: 26px; bottom: 26px; transform: translate(10px, 10px); }
.dsu-c-br::before { bottom: 0; right: 0; }
.dsu-c-br::after { bottom: 0; right: 0; }
.dsu-frame.dsu-in .dsu-corner { opacity: 1; transform: none; }
.dsu-frame.dsu-in .dsu-c-tr { transition-delay: 90ms; }
.dsu-frame.dsu-in .dsu-c-br { transition-delay: 180ms; }
.dsu-frame.dsu-in .dsu-c-bl { transition-delay: 270ms; }

/* One-shot scanline: once top-to-bottom after the backdrop washes out, and again at verification time */
.dsu-scanline {
  position: absolute;
  left: 0;
  right: 0;
  top: -14%;
  height: 96px;
  opacity: 0;
  background: linear-gradient(
    180deg,
    rgba(0, 0, 0, 0) 0%,
    rgba(0, 0, 0, 0.045) 58%,
    rgba(0, 0, 0, 0.1) 86%,
    rgba(0, 0, 0, 0.16) 97%,
    rgba(0, 0, 0, 0) 100%
  );
}
.dsu-dark .dsu-scanline {
  background: linear-gradient(
    180deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.05) 58%,
    rgba(255, 255, 255, 0.11) 86%,
    rgba(255, 255, 255, 0.18) 97%,
    rgba(255, 255, 255, 0) 100%
  );
}
.dsu-scanline.dsu-go { animation: dsu-scan 2600ms cubic-bezier(0.42, 0, 0.58, 1) 1; }
@keyframes dsu-scan {
  0% { top: -14%; opacity: 0; }
  10% { opacity: 1; }
  86% { opacity: 1; }
  100% { top: 102%; opacity: 0; }
}

/* The small line under the brand block: version + live clock (the clock lights up in the theme orange) */
.dsu-meta {
  position: absolute;
  left: 46px;
  top: 170px;
  z-index: 20;
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--dsu-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--dsu-muted);
  opacity: 0;
  transform: translateX(-18px);
  transition: opacity 560ms ease, transform 560ms cubic-bezier(0.16, 0.84, 0.24, 1);
  transition-delay: 330ms;
}
.dsu-meta.dsu-in { opacity: 1; transform: none; }
.dsu-meta-2 { color: var(--dsu-accent); }

/* Six stage slats: in a row under the left-column meta text, passed stages dimmed, the current one lit and stretched */
.dsu-slats {
  position: absolute;
  left: 46px;
  top: 196px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 5px;
  opacity: 0;
  transform: translateX(-18px);
  transition: opacity 560ms ease, transform 560ms cubic-bezier(0.16, 0.84, 0.24, 1);
  transition-delay: 420ms;
}
.dsu-slats.dsu-in { opacity: 1; transform: none; }
.dsu-slat {
  width: 20px;
  height: 2px;
  background: var(--dsu-hair);
  transition: width 460ms cubic-bezier(0.3, 0.9, 0.25, 1), background-color 320ms ease,
    opacity 320ms ease;
}
.dsu-slat.dsu-past { background: var(--dsu-ink); opacity: 0.3; }
.dsu-slat.dsu-on { width: 34px; background: var(--dsu-accent); opacity: 1; }

/* Voice-announcement indicator: lights up in the theme orange and bounces while speaking (matching the moments in the reference clip where the female voice reads the status line) */
.dsu-voice {
  position: absolute;
  left: 46px;
  bottom: 96px;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 16px;
  opacity: 0;
  transition: opacity 560ms ease;
  transition-delay: 480ms;
}
.dsu-voice.dsu-in { opacity: 1; }
.dsu-voice i {
  width: 2px;
  height: 20%;
  background: var(--dsu-hair);
  transition: height 140ms ease, background-color 240ms ease;
}
.dsu-voice.dsu-on i {
  background: var(--dsu-accent);
  animation: dsu-voice 560ms ease-in-out infinite;
}
.dsu-voice i:nth-child(1) { animation-delay: 0ms; }
.dsu-voice i:nth-child(2) { animation-delay: 90ms; }
.dsu-voice i:nth-child(3) { animation-delay: 180ms; }
.dsu-voice i:nth-child(4) { animation-delay: 60ms; }
.dsu-voice i:nth-child(5) { animation-delay: 140ms; }
@keyframes dsu-voice {
  0%, 100% { height: 20%; }
  50% { height: 100%; }
}

/* In narrow windows the right-hand monospace line collides with the ring, so drop it */
@media (max-width: 1180px) {
  .dsu-idline { display: none; }
}

/* Accessibility: respect the system "reduce motion" setting */
@media (prefers-reduced-motion: reduce) {
  #duckwork-startup-root .dsu-ret-rot-a,
  #duckwork-startup-root .dsu-ret-rot-b { animation: none; }
  #duckwork-startup-root .dsu-scanline.dsu-go { animation: none; }
}

</style>

      }
    } catch (err) { /* not writable in private mode — ignore */ }
    /* Unlock: Host-injected styles lock scrolling via html.dsu-lock, which must be
       cleared here too — otherwise the main UI can never scroll again. */
    document.documentElement.classList.remove('dsu-lock')
    document.documentElement.style.overflow = ''
    if (document.body) document.body.style.overflow = ''
    root.classList.remove('dsu-boot')
    root.classList.add('dsu-gone')
    setTimeout(function () {
      if (root && root.parentNode) root.parentNode.removeChild(root)
      try { window.dispatchEvent(new CustomEvent('duckwork-startup:done')) } catch (err) { /* noop */ }
    }, ms(900))
  }

  function requestSkip() {
    if (skipped || finished) return
    skipped = true
    releaseAll()
    finish()
  }

  if (C.allowSkip && ui.skip) {
    ui.skip.hidden = false
    ui.skip.addEventListener('click', function (e) { e.stopPropagation(); requestSkip() })
    escHandler = function (e) {
      if (e.key === 'Escape') { e.stopPropagation(); requestSkip() }
    }
    document.addEventListener('keydown', escHandler, true)
  } else if (ui.skip) {
    ui.skip.hidden = true
  }

  /* Public API: the settings "Preview now" button and every replay go through it */
  window.__DSH_STARTUP_API__ = {
    /* Settings preview and smoke tests: speak a single line directly */
    speak: function (en, zh) { voice.say(en, zh) },
    speakName: function (n) { return voice.speakName(n) },
    get voice() { return voice.current() },
    replay: injectSelf,
    skip: requestSkip,
    finish: finish,
    config: C
  }

  /* Lock scrolling so the app underneath never shows during the animation */
  document.documentElement.classList.add('dsu-lock')
  document.documentElement.style.overflow = 'hidden'
  if (document.body) document.body.style.overflow = 'hidden'
  setProgress(0.05)
  root.classList.remove('dsu-boot')

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { run() })
  } else {
    run()
  }
}

function stopPrev() {
  try { if (window.__DSH_STARTUP_API__ && window.__DSH_STARTUP_API__.finish) window.__DSH_STARTUP_API__.finish() } catch (e) {}
  const old = document.getElementById('duckwork-startup-root')
  if (old && old.parentNode) old.parentNode.removeChild(old)
  document.documentElement.classList.remove('dsu-lock')
  document.documentElement.style.overflow = ''
}
function play() {
  stopPrev()
  window.__DSH_STARTUP__ = { ...DEFAULTS }
  window.__DSH_STARTUP_LOADED__ = false
  window.__DSH_STARTUP_SKIP__ = false
  const root = document.createElement('div')
  root.id = 'duckwork-startup-root'
  root.className = 'dsu-root dsu-boot'
  document.body.appendChild(root)
  document.documentElement.classList.add('dsu-lock')
  runSplash()
}
window.__HS_REPLAY__ = play
document.getElementById('btnReplay').onclick = play
document.getElementById('btnSkip').onclick = function () {
  if (window.__DSH_STARTUP_API__) window.__DSH_STARTUP_API__.skip()
}
play()
</script>
</body>
</html>
