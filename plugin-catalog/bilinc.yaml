description: "Hosted memory for Duckwork with a full history: see what your agent remembered, when it changed and why. Recalls relevant memories before each turn, adds bilinc_recall, bilinc_remember, bilinc_revise and bilinc_forget tools, and mirrors Duckwork built-in memory writes. Maintained by ReARC Labs; free plan available. Disclosure — recall queries (the text of each message, when auto_recall is on), tool arguments, mirrored built-in memory writes, the Duckwork session id and, only if memory.bilinc.capture_turns is turned on, each turn's user and assistant text are sent over HTTPS to bilinc.space under your BILINC_API_KEY; requests carry User-Agent bilinc-duckwork/<version> and X-Bilinc-Client: duckwork-plugin headers. Secret-looking strings are redacted before sending. Recall and writes run on background threads inside Duckwork; no separate process, local database or telemetry."
maintainer: Fordex
