# Canonical catalog pin lives in Fordex/duckwork-agent plugin-catalog/file-tray.yaml.

name: file-tray
repo: https://github.com/DuckMind/duckwork
sha: REPLACE_WITH_40_CHAR_COMMIT
description: Session file tray — paths the Duckwork agent touched via read_file,
  write_file, or patch. Desktop pane and /files. No API keys.
maintainer: aydnOktay
tier: community
category: desktop
requires_duckwork: ">=0.21"
docs_url: https://github.com/DuckMind/duckwork
version: "0.1.0"
platforms: []
capabilities:
  provides_tools:
  - file_tray_list
  - file_tray_clear
  provides_hooks:
  - post_tool_call
  provides_middleware: []
  requires_env: []
