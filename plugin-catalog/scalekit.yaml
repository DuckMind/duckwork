name: scalekit
title: Scalekit
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: >-
  Call any Scalekit connector from Duckwork: 500+ connectors and 20,000+ tools. Disclosure — HTTP calls go to the Scalekit environment URL you paste; the three Scalekit values are read with get_secret; one person id is stored at plugin-data/scalekit/identifier; the model can request an approval link, run a named tool, or proxy one HTTP request. Provider tokens stay in Scalekit; no shell, no background process, no telemetry.
maintainer: Fordex
tier: community
category: tools
requires_duckwork: ">=0.20.0"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/scalekit/7bc7c7391c44/README.md"
