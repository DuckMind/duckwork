# Modified by Fordex for Duckwork distribution on 2026-11-17: fork-owned names and paths rebranded; original authorship and notices retained.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duckwork-gemini-media-generation"
version = "0.1.2"
description = "Google Gemini image and video generation backends for Duckwork Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "bytecakelake" }]
dependencies = ["google-genai>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY); deselected by default"]
addopts = "-m 'not live'"
