name: duckwork-experientiallabs
kind: model-provider
version: 0.4.0
description: Experiential Labs — OpenAI-compatible multi-model gateway
author: Spheraz
license: MIT
homepage: https://github.com/DuckMind/duckwork
tags: [experientiallabs, model-provider, openai-compatible]
requires_duckwork: ">=0.21.6"
# Credentials are not settings. Duckwork' native Settings → Providers → API keys
# tab (and `duckwork auth add experientiallabs`) edits EXPLABS_API_KEY and the
# EXPLABS_BASE_URL override directly from the profile's env_vars, so there is
# nothing to duplicate here. Only the /usage knobs below have no native home.
config_schema:
  cost_api_base:
    type: str
    default: "https://api.experientiallabs.ai/api/v1"
    label: Cost API base URL
    description: >-
      Advanced — base URL of the Cost API used for the /usage view. Only set
      this if the EXPLABS_BASE_URL chat mirror also serves the Cost API
      (GET /credits and GET /key).
  usage_timeout_s:
    type: float
    default: 4.0
    label: Usage fetch timeout (seconds)
    description: >-
      Advanced — per-request timeout for the two /usage GETs. Duckwork allows
      the usage hook 10 seconds total, so values above 4.5 are clamped.
