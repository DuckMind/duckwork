name: preview-text-size
label: Preview Text Size
version: 1.0.0
author: Pandeng Yao
homepage: https://github.com/DuckMind/duckwork
license: MIT
description: >
  Larger or smaller text in the Duckwork Desktop file preview pane. Scales the
  rendered Markdown from 90% to 175% through a row in Settings → Appearance,
  three command-palette entries and rebindable shortcuts, independent of chat
  text size and UI scale. Desktop-only (desktop/plugin.js); no agent tools,
  hooks, middleware or env vars.
tags: [desktop, appearance, accessibility, preview]
requires_duckwork: ">=0.22.0"
