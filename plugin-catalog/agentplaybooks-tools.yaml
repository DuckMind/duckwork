description: >-
  Connect AgentPlaybooks skills and hosted MCP/OpenAPI tools to Duckwork, with guided setup, profile selection, permission diagnostics and an authenticated MCP check. Requires Node.js 20+ and @agentplaybooks/cli@0.7.0; the CLI is installed separately. Disclosure — skill-only; the separately installed apb CLI does the work. `apb duckwork setup --apply` restores complete skill trees into the chosen project and edits the selected Duckwork profile's config.yaml to register those skills and a hosted playbook MCP endpoint. Local writes require --apply; setup also probes MCP initialization and tool listing using a scoped key from the process environment, without invoking tools. `doctor` checks profile credential variable names without exposing their values. Hosted operations contact agentplaybooks.ai (or an explicitly configured service); skill restore uses `apb login`, and `apb push --apply` uploads project configuration (secret references, not values).
