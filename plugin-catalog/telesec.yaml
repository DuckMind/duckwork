sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Telegram Business secretary: transcribes voice notes, round videos, and speech attachments right in the chat, with Settings and per-chat controls in Telegram's Manage Bot panel, plus opt-in text history (with import from a Telegram export), correspondence stats, and contact dossiers. Disclosure — audio goes to the STT backend Duckwork is configured with (local or external); transcript cleanup sends chat text through the host ctx.llm; opt-in dossiers send chat text through the Duckwork model task telesec_dossier (default Vercel AI Gateway to Google with zero data retention; an optional message check on the same gateway and optional Cloudflare fact extraction are off by default); an owner-sent /dossier posts that contact's stored dossier (without the owner note, but written with it) into the Business chat for the contact to read; runs local ffprobe/ffmpeg (argument lists, no shell) on attached audio; opt-in dossiers run a gateway background thread; modes, opt-in history, and dossiers are stored 0600 under DUCKWORK_HOME/data/telesec; reads only the numeric bot id prefix of TELEGRAM_BOT_TOKEN; no telemetry."
maintainer: Fordex
tier: community
category: voice
