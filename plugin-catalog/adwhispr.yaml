description: "Research competitor ads, clone the winners, and run campaigns through the hosted AdWhispr MCP. Finds brands verified to be advertising in a niche right now, their longest-running Meta and TikTok ads, Instagram content and Google keyword data; clones a proven ad into a finished image or AI video for your brand (free script approval before any credit is charged); and launches paused campaigns on Meta, Google, TikTok, X and ChatGPT Ads. Portable Agent Plugins v1 package with twenty-four workflow skills; OAuth uses pinned mcp-remote@0.1.49 over npx stdio, so Node.js 20.18.1+ and npm are required. Disclosure — creates and edits real ad campaigns that spend your ad budgets (always created paused, two-step confirm server-side) and renders videos that use paid credits; the AdWhispr server is marked untrusted, so Duckwork asks before every write or spend tool and refuses them in cron and headless runs. Sends research queries and your brand assets to adwhispr.com; sign-in is OAuth through npx mcp-remote@0.1.49."
