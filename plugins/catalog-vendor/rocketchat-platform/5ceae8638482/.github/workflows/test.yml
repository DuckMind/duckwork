name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Fordex/duckwork-agent
          path: duckwork-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: duckwork-agent/pyproject.toml
      - name: Install Duckwork and test dependencies
        run: python -m pip install -e ./duckwork-agent pytest pytest-asyncio aiohttp
      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          DUCKWORK_AGENT_PATH: ${{ github.workspace }}/duckwork-agent
