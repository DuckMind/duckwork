description: >-
  Hebrew (עברית) language pack for Duckwork — core CLI, gateway and tips (3,396 of 3,486 keys on main), TUI (1,331 of 1,356) and Desktop (5,153 of 5,245), with Desktop flipped right-to-left. Duckwork bundles no Hebrew, so the pack ships all three catalogs; values identical to English and entries whose English wording depends on an argument (on/off, show/hide) are omitted so they fall back to English. Disclosure — text-only catalogs plus an __init__.py whose register() is a no-op (kept so Desktop "Install from Git" accepts the pack, #138118); registering the pack never changes display.language, the user opts in via config.
