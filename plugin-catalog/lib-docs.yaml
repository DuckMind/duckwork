name: lib-docs
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: >-
  Look up current library docs from public npm and PyPI (no API keys). Resolve a package, fetch README and metadata, keep recent lookups on Desktop. Disclosure — HTTPS to registry.npmjs.org, pypi.org and cdn.jsdelivr.net (npm READMEs) only; package name and version leave the machine; recent lookups are stored under $DUCKWORK_HOME/plugin-data/lib-docs; the Desktop pane inserts text through Duckwork Desktop's internal duckwork:composer-insert event (not a public SDK API).
maintainer: Fordex
tier: community
category: tools
requires_duckwork: ">=0.21"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/lib-docs/380eaac3fc06/README.md"
