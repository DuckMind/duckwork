description: "A bell in the Duckwork desktop composer that pings the ntfy topic Duckwork already uses when a turn finishes. Click to cycle off, current turn, or all turns. Disclosure — when enabled, posts the first line of each finished reply plus model, duration, token and cost figures to the ntfy server/topic Duckwork is configured with (default ntfy.sh); reads NTFY_* from the profile .env and falls back to the ntfy CLI's ~/.config/ntfy/client.yml login (read-only)."
