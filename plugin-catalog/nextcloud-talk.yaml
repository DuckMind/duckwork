description: "Signed Nextcloud Talk bot webhooks and text replies for Duckwork, with JSON/XML OCS support. Disclosure — runs an HTTP webhook listener (default 0.0.0.0:8788, HMAC-verified with the bot secret) and sends messages and optional Basic-auth room lookups to your Nextcloud server; registers the `nextcloud_talk` gateway platform."
maintainer: Fordex
tier: community
category: platform
version: "0.2.1"
readme: true
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - NC_TALK_BASE_URL
  - NC_TALK_BOT_SECRET
known_issues:
- Text only; attachments, reactions and inbound reply-context reconstruction are not implemented.
- Dedupe is in-memory and does not survive restart; uncertain sends are not automatically retried.
- Valid empty OCS acknowledgements confirm delivery without returning a message ID.
