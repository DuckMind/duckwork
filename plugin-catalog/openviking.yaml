description: "Long-term memory for Duckwork. Capture conversations, recall useful facts across sessions and search your knowledge. Choose Quick Local, OpenViking Service (managed cloud) or your own server. Disclosure — conversation turns, tool results and MEMORY.md / USER.md edits are sent to the configured OpenViking server. Quick Local setup installs the newest OpenViking 0.5.x server release from PyPI at setup time (checked against PyPI's hash, not the version reviewed here; re-running setup upgrades it) plus a hash-pinned llama-cpp-python wheel and a local embedding model. It copies the active Duckwork static LLM API key into a private file under the profile for extraction, and its localhost server keeps running after Duckwork exits and after plugin removal (stop it with `duckwork openviking local stop`). Extraction can use a remote LLM. Custom localhost connections can start openviking-server from PATH with the profile environment minus Duckwork bot, gateway, GitHub and dashboard secrets; model and tool API keys still pass."
