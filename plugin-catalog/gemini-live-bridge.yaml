name: gemini-live-bridge
repo: https://github.com/DuckMind/duckwork
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: >-
  Realtime duplex voice chat with the Gemini Live API — a status-bar minibar for the Duckwork desktop app (transcript, model catalog, thinking level, session token meter, auto-redial via session resumption). Full-proxy architecture: the plugin backend owns the upstream Live WebSocket and the user's key (requires_env GOOGLE_API_KEY); the desktop UI only talks to localhost and receives single-use ephemeral tokens. No agent tools; desktop-focused, dashboard tab hidden. Disclosure — pressing Start captures microphone audio and streams it through the local backend to generativelanguage.googleapis.com using GOOGLE_API_KEY (or GEMINI_API_KEY) from the environment; input/output transcripts are held in backend memory for the session, and a Gemini session-resumption handle is written to .resume.json inside the plugin's install directory.
