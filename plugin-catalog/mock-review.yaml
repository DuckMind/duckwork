platforms: []
known_issues:
- "here.now hosting needs the official here-now skill in the active profile (`duckwork skills install official/productivity/here-now`) and a HERENOW_API_KEY; local and tailnet hosting need neither."
- "Waking the agent on Send needs the gateway's webhook platform; `duckwork mockreview setup` enables it and creates the route."
