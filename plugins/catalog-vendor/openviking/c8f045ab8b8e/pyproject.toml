[project]
name = "duckwork-plugin-openviking"
version = "2.1.2"
description = "Duckwork Agent memory provider plugin: openviking"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Duckwork venv by `duckwork plugins install` / `enable` and re-applied after
# every `duckwork update` (duckwork-agent#113851). Keep upper bounds: Duckwork pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "httpx>=0.27,<1",
    "psutil>=5.9,<9",
    "packaging>=23,<27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
