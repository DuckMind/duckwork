name: unitares
repo: https://github.com/DuckMind/duckwork
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: >-
  Records each Duckwork session on a UNITARES server you run: one identity per session and one check-in per completed turn, so the agent's working record carries across sessions. Fail-open; never blocks the agent. Disclosure — sends only to the server named in UNITARES_MCP_URL, which you host; there is no default server. Per session it sends your model name and platform; per completed turn a fixed check-in marker (never user, assistant or tool text). Hooks run synchronously, so an unresponsive server can delay a call by roughly 40 seconds (connection plus call timeout). After 3 consecutive failures the plugin stops reporting for that session only, until the session is finalized or reset; it stays fail-open and never blocks the agent. If UNITARES_BEARER is set, it is sent as a request header to that same server only.
maintainer: Fordex
tier: community
category: automation
requires_duckwork: ">=0.21.0"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/unitares/f3fe538768d5/README.md"
