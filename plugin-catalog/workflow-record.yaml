description: "duckwork record: demonstrate a browser workflow once (clicks, field values, navigations) and its bundled skill lets /learn turn the recording into a skill that replays it with the browser tools. A Duckwork Labs plugin: built by Fordex, not supported. Disclosure — attaches over CDP to a Chromium you point it at (--cdp, BROWSER_CDP_URL, browser.cdp_url or 127.0.0.1:9222) and records what you do in that tab until Ctrl-C; password, one-time-code and card fields are masked inside the page as {SECRET:name} and never written. Recordings stay local in <DUCKWORK_HOME>/recordings; nothing is sent anywhere until you run /learn on one, which hands it to your active model."
