<!doctype html><meta charset="utf-8"><title>Office layout live DOM checks</title>
<style>body{font:14px system-ui;margin:20px}iframe{width:100%;height:900px;border:1px solid #aaa}pre{white-space:pre-wrap}</style>
<h1>Live React DOM checks</h1><p>Shipped OfficePage with React, Canvas2D and compiled Tailwind; synthetic SDK and profile data, not an installed app.</p>
<p><button id="show">Show all profiles</button> <button id="hide">Hide offline</button> <a href="index.html">Open full UI</a></p><pre id="result">Running…</pre><iframe src="index.html"></iframe>
<script>
const frame = document.querySelector('iframe');
frame.onload = async () => {
  const w = frame.contentWindow, d = w.document, a = w.__layout, results = [];
  const wait = () => new Promise(resolve => setTimeout(resolve, 80));
  const assert = (value, message) => { if (!value) throw Error(message); results.push(message); };
  try {
    for (const [name, data] of [
      ['mixed', a.demo],
      ['online', a.demo.map(entry => ({...entry, online: true}))],
      ['offline', a.demo.map(entry => ({...entry, online: false, busy: false}))],
      ['empty', []],
    ]) {
      const summary = a.profileOverview(data);
      assert(summary.total === summary.working + summary.onlineUnknown + summary.offline, name + ' exclusive partition');
      for (const hide of [false, true]) {
        a.set(data, hide);
        await wait();
        assert(d.querySelectorAll('section[aria-label="Agent"] article').length === data.length, name + '/' + hide + ' dashboard includes all enabled profiles');
        assert(d.querySelectorAll('section[aria-label="Agent"] button[disabled]').length === data.length, name + '/' + hide + ' unavailable pause honest');
        assert(d.querySelector('[data-office-page]').scrollWidth <= d.querySelector('[data-office-page]').clientWidth + 1, name + '/' + hide + ' no horizontal overflow');
      }
    }
    a.set(a.demo);
    await wait();
    assert(d.querySelector('section[aria-label="Mức dùng đã ghi nhận"]'), 'recorded usage displayed');
    assert(d.querySelector('section[aria-label="Hoạt động gần đây"]'), 'activity scope displayed');
    const scene = [...d.querySelectorAll('button')].find(button => button.textContent.includes('Sơ đồ văn phòng'));
    assert(scene, 'secondary 3D scene available');
    scene.click();
    await wait();
    assert(d.querySelector('[data-profile-row="offline"]'), 'scene retains offline profile');
    a.hide(true);
    await wait();
    assert(!d.querySelector('[data-profile-row="offline"]'), 'scene hides offline profile');
    a.hide(false);
    window.__results = {ok: true, checks: results.length, results};
  } catch (error) {
    window.__results = {ok: false, error: String(error), results};
  }
  document.querySelector('#result').textContent = JSON.stringify(window.__results, null, 2);
  document.querySelector('#show').onclick = () => a.hide(false);
  document.querySelector('#hide').onclick = () => a.hide(true);
};
</script>
