description: "Live, read-only dependency graph of the Duckwork kanban boards in Duckwork Desktop: every board as a band, tasks as cards, dependencies as arrows with implied ones folded away. Click a task to light up its whole lineage with runs, last failure and the running worker's latest tool calls; deep links open a task directly, and a stdlib CLI renders the same graph as a standalone HTML file. Zero API keys, zero model tokens. Disclosure — reads every kanban board database and, for running tasks, the assignee profile's state.db (the kanban worker session's latest assistant messages and tool-call arguments), read-only, and shows them in Desktop through its own local dashboard routes."
