description: "No-Limit Texas Hold 'Em for Duckwork Desktop: play with three isolated Duckwork profile agents using play chips only. Agent decisions use configured models and may consume provider tokens; this is a local game, not gambling software. Disclosure — each opponent is a zero-tool Duckwork agent run in-process under the local Duckwork profile you select for it, using that profile's configured provider credentials and spending its tokens; reads every local profile's name, model and avatar for the picker; stores the table (including hole cards) in plugin-data/agent-hold-em/table.json."
