description: "Use your Cursor subscription models (Claude Opus/Sonnet 5.5, Composer 2.5, GPT-5.6, Grok) inside Duckwork Agent via the Cursor CLI's ACP server (`agent acp`). Install with one command (`npx duckwork-cursor-acp`) or `duckwork plugins install cursor-acp`. The plugin rewrites `.cursor/cli.json` in an empty private workspace every run with a deny-all list (`Read`, `Write`, `Shell`, `WebFetch`, `Mcp`) to prevent Cursor's native CLI tools from accessing host files. It includes a custom extractor that recovers both flat `{\"name\", \"arguments\"}` and inline `<tool_call>` blocks that standard regex bridges drop, retries on concurrent `set_model` calls, and reports `usage=None` so Duckwork proactive context compression functions correctly. Disclosure — sends the full conversation, Duckwork tool schemas and tool results to Cursor through your locally installed, signed-in Cursor CLI (`agent acp`); Cursor's own tools are fenced by a deny-all `.cursor/cli.json` that the plugin rewrites in a private workspace under `$DUCKWORK_HOME/cache/cursor-acp-workspace` on every start (a differing existing file is backed up to `cli.json.bak`), and Duckwork executes every tool call under its own approvals."
