sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Read one CalDAV calendar collection you run, with list_events and read_event. Disclosure — Sends CALDAV_USER and CALDAV_PASSWORD as Basic auth to your CALDAV_URL, does not follow redirects, and starts no local program. Over plain http that password travels unencrypted. The tools are on for every surface, including gateways, and the plugin has no user list of its own: anyone you allow on your Duckwork gateway reads the calendar with your password. Turn a surface off with duckwork tools. A watch is a cron job you create yourself with duckwork cron create. Each run is at least one model turn, there is no daily cap, and the job stays until you run duckwork cron remove. Under plugins.isolation: host the watch cannot run and posts a notice saying so on every run. When the watch can run, it reports a problem on the first run, when the cause changes and again after 23 hours, or on every run when its data directory cannot be written. Each request gives up after 20 seconds without data, and a whole call has no time limit. The watch relies on private parts of Duckwork, so an update can stop it. State lives in plugin-data/event-read. Not tested against a vendor-hosted calendar."
maintainer: Fordex
