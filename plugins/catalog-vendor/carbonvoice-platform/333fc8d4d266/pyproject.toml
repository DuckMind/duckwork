[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duckwork-plugin-carbonvoice"
version = "0.3.6"
description = "Carbon Voice gateway adapter for Duckwork Agent"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-socketio[asyncio_client]>=5",
]

[project.entry-points."duckwork_agent.plugins"]
carbonvoice = "duckwork_plugin_carbonvoice"

[tool.setuptools]
packages = ["duckwork_plugin_carbonvoice"]

[tool.setuptools.package-dir]
duckwork_plugin_carbonvoice = "."
