title: Membase
description: "Long-term memory for you and your AI from Membase (membase.com, by Unibase): one memory every connected AI shares. Searches the user's Membase memory before each turn (8 s, fail-open) and adds membase_search, membase_save and membase_profile. Disclosure — user prompts are sent as search queries to the Membase API (api.app.membase.com); with the opt-in capture_turns setting the user's messages are saved there too, and what Duckwork' built-in memory records about the user is saved to their Membase profile. MEMBASE_API_KEY comes from the Duckwork secret scope; the only local file is $DUCKWORK_HOME/unibaseio-membase.json. No background processes, shell commands or telemetry."
