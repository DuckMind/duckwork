# Optional pip distribution of the Duckwork plugin (entry-point group `duckwork_agent.plugins`).
#
# It lives in this subdirectory, not next to plugin.yaml, on purpose: a pyproject.toml beside
# plugin.yaml makes Duckwork treat the directory plugin as a Python-dependency workspace member, which
# adds a dependency-consent step and makes `duckwork plugins install ... --enable` refuse to enable
# non-interactively. The plugin itself is stdlib-only.
#
# Build or install from here (in-tree build; the package source is the parent directory):
#   pip install ./plugins/duckwork/pypi
#   pip install "git+https://github.com/unbrowse-ai/unbrowse#subdirectory=plugins/hermes/pypi"
[project]
name = "unbrowse-duckwork"
version = "12.1.0"
description = "Unbrowse plugin for Duckwork Agent: hosted website tools over the Unbrowse remote MCP"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://unbrowse.ai"
Source = "https://github.com/DuckMind/duckwork"

[project.entry-points."duckwork_agent.plugins"]
unbrowse = "unbrowse_duckwork"

[tool.setuptools]
package-dir = { "unbrowse_duckwork" = ".." }
packages = ["unbrowse_duckwork"]
include-package-data = false

[tool.setuptools.package-data]
unbrowse_duckwork = ["plugin.yaml", "skills/unbrowse/*.md", "skills/unbrowse/references/*.json"]
