name: ruapi
kind: model-provider
version: 0.1.0
description: RuAPI providers for Duckwork. Claude models over RuAPI's native Anthropic Messages API (ruapi), GPT, Gemini, DeepSeek, GLM, Qwen, Kimi and other chat models over its OpenAI-compatible API (ruapi-openai); one API key for both.
author: RuAPI
license: MIT
homepage: https://www.ruapi.ai/?utm_source=duckwork&utm_medium=plugin
requires_duckwork: ">=0.21.5"
requires_env:
  - name: RUAPI_API_KEY
    description: "RuAPI API key"
    url: "https://github.com/DuckMind/duckwork"
    secret: true
