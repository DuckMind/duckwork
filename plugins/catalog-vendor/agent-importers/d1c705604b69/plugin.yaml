name: agent-importers
label: Agent Importers
kind: standalone
version: 1.1.0
author: NousResearch
homepage: https://github.com/DuckMind/duckwork
description: >
  `duckwork import-agent`: import an OpenClaw (~/.openclaw), Claude Code (~/.claude), Codex CLI
  (~/.codex) or Cursor (~/.cursor) setup into Duckwork in one command. Instructions, Cursor rules
  and memories become memory entries, Bash permission rules
  become command allow/deny lists, MCP servers land in config.yaml, and skills are copied.
  Always previews first; API keys and credentials are never imported, except OpenClaw's
  allowlisted secrets when you pass --migrate-secrets. `duckwork import-agent openclaw` takes a
  restore-point backup first; the old `duckwork claw migrate` / `duckwork claw cleanup` spelling
  keeps working, and the openclaw-migration skill ships along. `--sync` re-imports sources that
  changed. Formerly built into Duckwork core.
requires_duckwork: ">=0.21.6"
provides_tools: []
provides_hooks: []
