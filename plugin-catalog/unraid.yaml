description: "Read-only Unraid monitoring for Duckwork Desktop: server metadata, array capacity, Docker containers, virtual machines, and grouped alerts. Disclosure — sends fixed GraphQL queries to the user-configured Unraid host and stores a VIEWER key through Duckwork secret scope; no telemetry, background process, shell, SSH, MCP, or mutations."
