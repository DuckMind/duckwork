# Modified by Fordex for Duckwork distribution on 2026-11-17: fork-owned names and paths rebranded; original authorship and notices retained.
[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lumberroom-duckwork"
version = "1.0.2"
description = "lumberroom as Duckwork Agent's memory provider: recall on every turn, writes through the engine's own tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "the-cybersapien" }]
# Upper bounds on purpose: Duckwork installs a directory provider's dependencies under its own exact
# pins and refuses a plugin whose ranges cannot resolve against them.
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx2>=2.7.0,<3",
  "filelock>=3.12,<4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.3.0"]

[project.entry-points."duckwork_agent.memory_providers"]
lumberroom = "lumberroom_duckwork:register"

[project.urls]
Source = "https://github.com/DuckMind/duckwork"
Engine = "https://github.com/lumberroom/lumberroom"

# This directory is the package. Duckwork loads it in place from ~/.duckwork/plugins/lumberroom, and
# the wheel maps the same files under lumberroom_duckwork/.
[tool.hatch.build.targets.wheel]
only-include = [
  "__init__.py", "_version.py", "auth.py", "bridge.py", "cli.py", "config.py", "gate.py", "importer.py",
  "plugin.yaml", "provider.py", "recall.py", "schemas.py", "tokens.py", "tools_snapshot.json",
  "wizard.py",
]
sources = { "" = "lumberroom_duckwork" }

[tool.hatch.build.targets.sdist]
exclude = ["tests", "scripts", "docs", ".venv*", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
