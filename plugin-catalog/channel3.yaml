description: "Shop 100M+ products across thousands of US retailers: search, compare every store's live price, and switch variants (color, size) on inline product cards in Duckwork Desktop. Portable Agent Plugins v1 package (mcp.json + skills/ + desktop/). Disclosure — connects to the hosted Channel3 MCP server at mcp.trychannel3.com (no account or key; free tier rate-limited per IP); search queries (and any image URL for visual search), product ids and variant selections go to it, and the Desktop cards call it directly from the app; a server-issued thread_id links searches within a conversation; product images load from cdn.trychannel3.com; Buy buttons open buy.trychannel3.com redirect links in the browser; nothing is purchased in-app and no credentials are stored."
