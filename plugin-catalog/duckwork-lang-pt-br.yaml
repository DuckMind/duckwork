title: Brazilian Portuguese (Português do Brasil) Language Pack
description: "Brazilian Portuguese (pt-BR) language pack for Duckwork Agent covering all three UI surfaces — core CLI/gateway/platforms (3,477/3,477 keys), the Ink TUI (1,356/1,356) and the Desktop app (5,172/5,176). Every translatable key exists and every value is translated against the English source of `main`: no key upstream has since removed, zero placeholder divergence, and the four remaining Desktop keys are arrays/structured values a text pack cannot carry. Checked with `duckwork plugins validate` and with the pack's own `tools/verify_pack.py`, which also runs as public CI on every push. Core and TUI mirror the bundled `pt` locale, registered as a real `pt-br` variant so it wins over the `pt`/`pt-BR` alias; the Desktop catalog is the original contribution (first proposed upstream in PR #92590, 2026-08-23), since the Desktop app ships no Portuguese at all. Manifest-only plugin: flat dotted YAML catalogs under locales/, no code, no network, no dependencies. Registering the pack never changes display.language — the user opts in via `duckwork config set display.language pt-br`. A weekly drift workflow reports when `main` adds or drops keys; nothing self-updates. Tradução pt-BR da interface do Duckwork Agent."
