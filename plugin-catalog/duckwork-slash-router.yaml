description: "Jev-powered routing for misspelled, shortened, and meaning-based slash commands in the Duckwork Desktop composer. Preserves drafts when unsure. Requires a TypeSafe API key; every non-exact lookup uses paid TypeSafe API usage. Disclosure — every non-exact slash token is sent through the plugin's local backend to api.typesafe.ai (paid, your TYPESAFE_API_KEY) together with the Desktop command catalog (names and descriptions), any prior route, up to 8 saved correction explanations and any clarification you type into its panel; message arguments and conversation content are not sent; the backend reads DUCKWORK_HOME/.env only to check whether TYPESAFE_API_KEY is set."
