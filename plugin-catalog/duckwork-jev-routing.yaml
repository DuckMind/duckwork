description: "Per-turn model routing for the request that is about to go out. Jev reads the turn, picks the tier it deserves, and the plugin rewrites the provider request onto that model, including the reasoning level when the request carries one. Shadow by default, with notify, confirm and auto modes, a strip under the composer for the turn that was just routed, and a spend ledger. A pick on another provider is reported rather than sent, because a plugin cannot open a second provider client. Disclosure — once a routing JSON is configured, every turn (shadow mode included) sends the current message, up to 4,000 characters of recent user/assistant turns, the active model name, an estimated context size and the spend/budget snapshot to TypeSafe (api.typesafe.ai, endpoint overridable in that JSON), and the jev_route tool and /jev-routing route send their text the same way; in auto mode it rewrites the model and reasoning level on outgoing requests, and in Duckwork Desktop the auto mode and the approve row also switch the session's model, including onto another provider (core's expensive-model confirmation is shown to the user, never answered automatically)."
