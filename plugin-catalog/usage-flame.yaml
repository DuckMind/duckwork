description: "Pinned glowing chip + fire-themed panel with live subscription-quota windows (remaining %, reset countdown, burn-rate pace and run-out forecast with sparkline history) for every provider Duckwork reports usage for. 12 color themes and fonts, RU/EN, zero dependencies, works on Windows. Disclosure — runs duckwork usage --json through the Desktop gateway (cli.exec) every 1–15 minutes and sweeps up to 8 providers every 15 minutes; each run queries that provider's usage endpoint with the credential Duckwork already holds. Reads the composer's selected provider from Desktop localStorage. No network calls of its own."
