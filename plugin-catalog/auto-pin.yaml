name: auto-pin
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Automatically pin every new interactive session (desktop, CLI, TUI) and the branches you fork from them. Cron, one-shot, subagent and messaging sessions are left alone, and unpinning a session sticks. Disclosure — on each new desktop/CLI/TUI session it sets the session's pinned flag in Duckwork's session database (state.db) through the shared SessionDB handle, and records each automatic pin in $DUCKWORK_HOME/auto-pin/ledger.txt; no network, no tools."
maintainer: Fordex
