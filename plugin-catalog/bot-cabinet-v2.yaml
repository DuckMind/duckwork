description: "Tell Cabinet the job you need done and it answers with the smallest setup that does it (one chat, a skill, a routine, a Bot or a crew), shows which answers led there, then helps you act: add one of botcabinet.com's 20 Bots (each with its test record shown) as a Duckwork profile, plan a new Bot line by line, or set up a crew of Bots in a handoff order with blocked Kanban cards. Everything Cabinet makes can be removed again from My Bots, and a Bot that Duckwork's own Bots catalog carries is handed over to it, never duplicated. Disclosure — fetches its Bot catalog from https://botcabinet.com/catalog.json on open and Refresh (data only, 2 MB cap) and, after you confirm, creates Duckwork profiles whose instructions (SOUL.md) come from that catalog; can create and archive Kanban cards for a crew; deletes only profiles it created that you have not changed; reads ~/.duckwork/profiles and hashes profile files to track what it made; calls private Duckwork modules (duckwork_cli.profiles, kanban_db), so a Duckwork update can break it; no shell, credentials, telemetry or self-updates."
