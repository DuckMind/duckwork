title: ctx checkpoint
description: "Memory provider that archives the direct user/assistant transcript into a ctx knowledge store before every compaction, deterministically and with no LLM in the path, and hands the resulting block IDs to the compaction summary so the exact wording stays recoverable. Best-effort on any supported Duckwork; with compression.checkpoint_required on Duckwork 0.21.1+ it uses the fail-closed pre-compress checkpoint contract (#94639) and blocks compaction until the checkpoint is durable. Disclosure — the turns about to be compacted (tool results and system prompts excluded, secrets redacted twice) are written through Duckwork' MCP dispatch to the ctx server you configure in mcp_servers; the plugin holds no credentials, makes no other network calls and has no telemetry; it imports the core modules agent.redact, tools.registry and duckwork_cli.config."
