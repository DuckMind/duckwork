sha: "86b0c19d1504bc127a6c34d8a8d146e58276ef63"
version: "1.0.1"
description: >-
  Review boards for UI mockups. The agent builds a board from a decisions.json file and your prototype pages; you open it on desktop or phone, mark each decision approve, change or skip, pin comments on the mocks and press Send, and your agent wakes up with the feedback as a markdown digest. Four mock_review tools, the `duckwork mockreview` CLI and slash command, and a bundled usage skill. Boards are served from your computer (loopback by default, or your tailnet) or published on here.now. Disclosure — when autostart is on (off until `duckwork mockreview setup`), a board web server (127.0.0.1:8790 by default) and one worker thread run inside the gateway process; setting host to 0.0.0.0 exposes every review to your network with no login. Outbound calls: a signed POST to the local Duckwork webhook (localhost:8644) on Send, and, only for reviews hosted on here.now, https://here.now/api/v1 with your HERENOW_API_KEY. Secrets are read through Duckwork's secret scope only. Runs `bash publish.sh` from the official here-now skill (key in the child environment), `tailscale status --json` and `tailscale serve status --json` (read only; on macOS the Tailscale app's own binary if the symlink crashes) for tailnet hosting, and from `setup` the duckwork subcommands `--version`, `gateway status`, `config get/set/unset`, `webhook subscribe`, `webhook remove` (only for a stale self-delivering route, after you confirm) and `plugins validate`. Reviews are stored under $DUCKWORK_HOME/workspace/mock-reviews. No telemetry, no update check, no Python dependencies.
maintainer: "Fordex"
tier: community
category: tools
requires_duckwork: ">=0.22.0"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/mock-review/778460c7bf24/README.md"
