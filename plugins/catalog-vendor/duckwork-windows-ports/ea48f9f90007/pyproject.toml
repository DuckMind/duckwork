[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "duckwork-windows-ports"
version = "0.1.0"
description = "Read-only port-owner tool for Duckwork Agent on Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/DuckMind/duckwork"
Issues = "https://github.com/DuckMind/duckwork"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["duckwork_windows_ports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
