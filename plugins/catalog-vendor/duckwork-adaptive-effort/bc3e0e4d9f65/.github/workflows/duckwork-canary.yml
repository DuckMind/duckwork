name: Duckwork master canary

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Duckwork master canary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DUCKWORK_SOURCE_ROOT: ${{ github.workspace }}/.ci/duckwork
      PYTHONPATH: ${{ github.workspace }}/.ci/duckwork
      DUCKWORK_HOME: ${{ github.workspace }}/.ci/home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Duckwork master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Fordex/duckwork-agent
          path: .ci/duckwork
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare and test
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -c "import agent.reasoning_effort; import duckwork_cli.plugins"
          ./scripts/run_tests.sh --junitxml=test-results.xml
      - name: Print Duckwork commit
        run: |
          DUCKWORK_SHA=$(git -C .ci/duckwork rev-parse HEAD)
          echo "Tested with Duckwork: $DUCKWORK_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Require real integration tests and no skips
        run: python .github/scripts/verify_test_report.py test-results.xml
