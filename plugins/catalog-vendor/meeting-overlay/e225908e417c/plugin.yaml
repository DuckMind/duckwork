name: meeting-overlay
version: "0.1.1"
description: "Disclosure — sends meeting transcripts to Fordex inference with your Duckwork login (fallback OpenRouter key from ~/.duckwork/.env; optional OCTOPUS_DESK_URL); installs a launchd agent that records mic/system audio; writes and deletes under your Obsidian vault; macOS + source install only. Native desktop pane showing the live meeting transcript, answer, and daemon status."
author: "taxbax"
