known_issues:
- "Order status needs a signed-in Make Parts Now account, which the plugin's server doesn't have; it answers with a link to makepartsnow.com/orders. To ask Duckwork about orders, add a signed-in server once: duckwork mcp add makepartsnow-orders --url \"https://makepartsnow.com/mcp/assistant/signin?client=hermes\" --auth oauth --connect-timeout 300"
