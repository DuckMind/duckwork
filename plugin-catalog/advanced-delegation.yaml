title: Advanced Delegation
description: 'Two extra delegation modes for `delegate_task`, next to the built-in default. Model routes (`delegation.backend: model_map`): the agent picks a named model route per subagent from a list you define (e.g. fast, deep, local). Profile routes (`delegation.backend: profile_routes`): the agent runs a subagent as one of your Duckwork profiles, with that profile''s own model, credentials, skills and SOUL.md. Only route names and their one-line descriptions reach the model. Adds `duckwork delegation config` (pick the mode and edit its routes; `--show` prints the setup) and the `/delegation` slash command (save a mode for the next session, or `--now` to apply it to the current chat). Needs Duckwork 0.22.5 or newer, the first release with pluggable delegation providers; Duckwork 0.22.0 to 0.22.4 refuses to install it, and on a core older than 0.22.0 it installs, logs one warning and does nothing. Disclosure — no Python dependencies and no network or model calls of its own; subagents run through core''s `delegate_task` on the routes you configured. Writes only `delegation.backend` and `delegation.backends.*` (model_map / profile_routes) in the active profile''s config.yaml, through core''s config writer. A model route''s optional `api_key` is stored in config.yaml in plain text (`provider:` keeps keys in .env / auth.json). Listing a profile under profile routes lets this profile''s subagents use that profile''s credentials, SOUL.md and terminal policy.'
