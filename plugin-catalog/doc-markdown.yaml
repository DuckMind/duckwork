name: doc-markdown
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Convert one local file to Markdown with doc_convert on Linux and macOS, built on Microsoft's MarkItDown. Microsoft and MarkItDown are trademarks of the Microsoft group of companies. Disclosure — the doc_markdown toolset is on by default on every surface, including a gateway, so anyone you allow there can call doc_convert; stop it with duckwork tools. It does not fetch pages. Unattended sessions still convert when Duckwork calls the tool. This plugin creates no cron job. A child process runs MarkItDown with no Duckwork keys in its environment; on macOS the plugin runs ps about every 10 ms to watch that child's memory. It stops 8 seconds after its converters load, at 60 seconds if loading never finishes, or above 922746880 bytes. It is not a sandbox: after realpath it may read any allowlisted path it can open. Unpublished Duckwork code locates the Duckwork home, and a failed check refuses the path. Removal deletes the plugin directory, not the markitdown package. Windows was not tested."
maintainer: Fordex
