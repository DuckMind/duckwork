name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml fastapi httpx
      - run: python -m pytest -q

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # the pane runs in the app's own runtime; this is the no-app gate for it
      - run: node --check desktop/plugin.js
      - run: node --test tests/desktop.test.mjs
