[project]
name = "duckwork-ldap-auth"
version = "1.0.0"
description = "LDAP / Active Directory password login for the Duckwork Agent web dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
authors = [{ name = "angel12" }]
# Duckwork's package manager installs these into the Duckwork environment when
# the plugin is enabled. ldap3 is pure Python (works on Windows and Termux).
dependencies = [
  "ldap3>=2.9.1,<3",
]

[project.urls]
Homepage = "https://github.com/DuckMind/duckwork"

