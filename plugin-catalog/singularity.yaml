description: 'Singularity/Apptainer terminal backend: Duckwork''s terminal, file and code tools run inside a hardened, rootless container on this machine (--containall --no-home), with CPU/memory limits and an optional per-session persistent overlay (`duckwork config set terminal.backend singularity`; image from `terminal.singularity_image`). Formerly built into Duckwork core; existing users are migrated automatically. Disclosure — no Python dependencies and no network calls of its own: it drives the `apptainer` (or `singularity`) CLI you install, which pulls the configured image (default `docker://fordex/duckwork-sandbox:desktop`) and caches a SIF under your scratch directory. Your skills and registered credential files are bind-mounted read-only into the container, and because the container is a disposable sandbox Duckwork skips its dangerous-command prompts there, as for its other container backends.'
