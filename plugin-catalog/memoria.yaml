name: memoria
repo: https://github.com/DuckMind/duckwork
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
subdir: "plugins/catalog-vendor/memoria/3e2c93466bae"
description: >-
  Memoria Cloud memory provider with scoped recall, explicit memory tools and opt-in background capture. Disclosure — sends recall queries and explicit memory operations to api.thememoria.ai by default (or a configured self-hosted origin). When enabled, auto capture uploads completed user/assistant text for fact extraction, excluding tool results and media. A local SQLite outbox stores pending text; credentials are resolved through the active Duckwork profile's MEMORIA_API_KEY secret.
maintainer: Fordex
tier: community
category: memory
requires_duckwork: ">=0.21.5"
version: "0.1.1"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/memoria/3e2c93466bae/README.md"
readme: true
platforms: [linux, macos]
known_issues:
- "Development preview: local CLI acceptance passed; Desktop has not been validated and gateway platforms are disabled."
- "Auto capture is off by default. One-shot CLI exit can interrupt an in-flight capture, leaving an uncertain event requiring manual inspection."
- "Explicit-write exclusions apply to the current turn only. Auto capture can retain paraphrases, recalled facts from later turns, transient results or operation requests; global semantic deduplication is not guaranteed."
- "Ambiguous write outcomes are not automatically retried; this plugin does not provide exactly-once capture."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - MEMORIA_API_KEY
image: ''
screenshots: []
legacy_sources:
- "https://github.com/matrixorigin/memoria#plugins/hermes"
