name: post-cortex
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Self-hosted long-term memory through a post-cortex daemon (https://github.com/julymetodiev/post-cortex): typed records (decisions, fixed problems, code changes) in an entity graph with local semantic search. Recalls related records from the profile's workspace before each turn, puts the user card and the workspace's project card in the system prompt, mirrors built-in memory writes as records, and adds post_cortex_search, post_cortex_record and post_cortex_context (graph neighbours and reverse dependencies of named components) plus the post-cortex:memory skill. Records and captured turns carry the author duckwork:<profile>. Profiles are mapped to shared workspaces by name glob, so a team of profiles recalls each other's records. Disclosure — talks only to the post-cortex daemon at the configured URL (default http://127.0.0.1:3737; a remote daemon over plain HTTP should sit on a private network or behind TLS): each non-trivial user prompt (up to 2,000 characters) is sent as a search query, and built-in memory writes and post_cortex_record calls are sent as records; with the opt-in capture setting (off by default) each completed turn of the primary agent is sent too: the user's message (with the sender's display name when Duckwork knows it), the final reply, tool names and file paths, never tool output; nothing goes to third parties. Disclosure — the daemon stores records (and captured turns, deleted after its message_retention_days) in its own database and redacts credentials, e-mail addresses, phone numbers and public IPv4 addresses on write. Disclosure — PCX_TOKEN (and optionally PCX_URL) is read through the Duckwork secret scope; the only local state is $DUCKWORK_HOME/post-cortex.json (0600, never holds the token). No threads or processes of its own (capture runs on Duckwork' sync worker), no shell commands, no deletes in post-cortex; cron and subagent runs never write automatically."
maintainer: Fordex
tier: community
category: memory
requires_duckwork: ">=0.22.2"
version: "0.2.0"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/post-cortex/fde0facf16f8/README.md"
readme: true
known_issues:
- "Requires a post-cortex daemon 0.4.0 or newer; cards, authorship, capture and derived_from need 0.5.0 and are skipped on an older daemon. A daemon bound to 0.0.0.0 must list the host in the plugin URL in its allowed_hosts, or every request gets 403."
