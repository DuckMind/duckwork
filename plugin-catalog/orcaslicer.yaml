title: OrcaSlicer for Duckwork
description: >-
  Prepare, slice, preflight and export 3D prints with stock OrcaSlicer profiles. Includes explicit printer upload/control, camera snapshots and monitoring through supported protocols. Protocol and hardware limits are documented. Independent of OrcaSlicer and Fordex. Disclosure — executes the installed local slicer and exposes printer upload, start, pause, resume and cancel; agent-supplied confirmation is not independent human authentication. Printer/camera credentials are read from ORCA_*/DUCKWORK_ORCA_* environment variables named in tool arguments (HTTPS required unless allow_plaintext_credentials is set); plugin state lives in ~/.duckwork-orca (DUCKWORK_ORCA_HOME), outside DUCKWORK_HOME.
maintainer: Fordex
