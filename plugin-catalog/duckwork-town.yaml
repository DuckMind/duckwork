description: >-
  Local pixel-art town where every Duckwork session is a resident and every tool call walks to a building. Passive lifecycle bridge to a loopback-only server; prompts, arguments, and output never leave the process. Disclosure — version 0.3.0 bundles the Town Node server and a prebuilt browser app inside the plugin directory and adds a duckwork town setup/start/status/stop/open command tree. Nothing is downloaded and no npm install runs at any point; node (^20.19 or >=22.12) must already be installed and is launched only by the explicit duckwork town start command, bound to 127.0.0.1 only. Runtime state, a 0600 bridge token, a bounded event journal and rotated server logs are written under DUCKWORK_HOME/duckwork-town/runtime/. On start the server also reads DUCKWORK_HOME/cron/jobs.json (job id and enabled flag only) to place one resident per enabled scheduled job.
maintainer: Fordex
