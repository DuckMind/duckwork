description: "Instant context compaction for Duckwork Agent: builds the compaction summary in milliseconds with no LLM call, keeping the exact commands, exit codes, errors and files, each linked back to its original message for recall via session_search. Disclosure — no network calls, shell commands or credentials; reads Duckwork's config.yaml through Duckwork's own loader; subclasses ContextCompressor and relies on its private methods, falling back to the stock compressor if they are missing."
