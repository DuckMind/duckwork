[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duckwork-handflow"
version = "0.1.0"
description = "Handflow — a Manus-style planning flow for Duckwork: the agent writes a step plan, marks it as it works, and a live desktop pane shows the same plan."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ritesh Patel (DECRUX9812)" }]
keywords = ["duckwork", "duckwork-plugin", "plugin-catalog", "planning", "agent-flow", "manus", "openmanus"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
# Runtime needs nothing beyond the stdlib: Duckwork supplies FastAPI for the
# dashboard routes and Node for the desktop half.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
pythonpath = [".", "tests"]

[tool.setuptools]
packages = ["handflow"]
