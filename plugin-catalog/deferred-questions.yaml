name: deferred-questions
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Durable non-blocking questions with exact answer binding and gateway continuation. Disclosure — its pre_gateway_dispatch hook sees every gateway message and consumes only `dq <id> …` answers from the stored recipient; with `enable_tool` on, the model can send questions to any chat the gateway already authorizes, and a question marked continue_agent resumes that chat's agent with the user's answer; questions and answers are stored unencrypted in $DUCKWORK_HOME/deferred-questions/questions.sqlite3; it calls private gateway and adapter methods, so a Duckwork update can break delivery until it is re-pinned."
maintainer: Fordex
