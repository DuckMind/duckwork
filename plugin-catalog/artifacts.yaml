title: Duckwork Artifacts
description: "Private library for the finished documents agents make (self-contained HTML, Markdown, SVG, PNG, WebP), with an Artifacts dashboard tab and explicit, expiring, revocable guest links for one artifact each. Early public preview. Disclosure — the plugin is a client of a separate Artifacts service you run yourself from the same repository (not installed by the plugin): six tools and the dashboard tab send artifact bytes and metadata to DUCKWORK_ARTIFACTS_URL with the machine credential DUCKWORK_ARTIFACTS_TOKEN, resolved through Duckwork secret scope, held server-side and never sent to the browser. artifact_publish reads a resolved local path only after Duckwork read-policy and supported-extension checks; an explicit kind must match. artifact_download checks raw and resolved destinations against Duckwork write policy, refuses approval-required paths even with overwrite=true, and writes atomically through a temporary sibling. File policy is defense in depth, not filesystem isolation. Sharing creates a public bearer link on your service; revocation cannot recall copies. Stores no data and no credentials of its own; no hooks, background processes or telemetry."
maintainer: Fordex
tier: community
