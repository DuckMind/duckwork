# Canonical catalog pin lives in Fordex/duckwork-agent plugin-catalog/lib-docs.yaml.

name: lib-docs
repo: https://github.com/DuckMind/duckwork
sha: REPLACE_WITH_40_CHAR_COMMIT
description: Look up current library docs from public npm and PyPI (no API keys).
  Resolve a package, fetch README and metadata, keep recent lookups on Desktop.
  Disclosure — HTTPS to registry.npmjs.org and pypi.org only.
maintainer: aydnOktay
tier: community
category: tools
requires_duckwork: ">=0.21"
docs_url: https://github.com/DuckMind/duckwork
version: "0.1.1"
platforms: []
capabilities:
  provides_tools:
  - lib_docs_resolve
  - lib_docs_get
  - lib_docs_recent
  provides_hooks: []
  provides_middleware: []
  requires_env: []
