name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the pinned duckwork-agent commit
        # Single source of truth: [tool.duckwork-zerosignal-provider].duckwork_ref in pyproject.toml.
        run: |
          set -euo pipefail
          ref="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["duckwork-zerosignal-provider"]["duckwork_ref"])')"
          echo "DUCKWORK_REF=${ref}" >> "$GITHUB_ENV"
          echo "duckwork-agent @ ${ref}"

      - name: Install pinned duckwork-agent (editable) and dev deps
        # duckwork-agent's setup.py refuses to build a wheel outside Nix, so a plain
        # `pip install git+...` fails; an editable install from a checkout at the pinned
        # commit is the supported route.
        run: |
          set -euo pipefail
          git init -q duckwork-agent-src
          git -C duckwork-agent-src fetch -q --depth 1 https://github.com/DuckMind/duckwork "${DUCKWORK_REF}"
          git -C duckwork-agent-src checkout -q FETCH_HEAD
          python -m pip install --upgrade pip
          pip install -e ./duckwork-agent-src
          pip install -e ".[dev]"

      - name: duckwork plugins validate
        # The same admission check the Duckwork plugin-catalog CI runs against a candidate entry.
        run: duckwork plugins validate .

      - name: Tests
        run: python -m pytest -q
