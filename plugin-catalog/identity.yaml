description: "View and edit the identity files (SOUL.md, MEMORY.md, USER.md, AGENT.md/DUCKWORK.md) from chat, switch the active profile, and see per-line usage with colour-coded staleness timestamps. Adds six tools, /identity, /identity-switch and /identity-dashboard commands, and a utilization dashboard pane. Disclosure — reads and writes the identity files and a line-utilization record inside the selected profile directory under DUCKWORK_HOME, and can change which profile is active; it performs no network I/O and holds no credentials. Disclosure — the model-callable identity_edit tool rewrites SOUL.md/MEMORY.md/USER.md/AGENT.md and identity_switch_profile writes DUCKWORK_HOME/active_profile."
