name: command-tray
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: >-
  Session command tray — shell commands the Duckwork agent ran via the terminal tool (success and failure). Desktop pane and /commands. No API keys. Disclosure — records terminal commands with exit code, workdir and a 160-char redacted output preview to $DUCKWORK_HOME/plugin-data/command-tray/state.json; the Desktop pane inserts text through Duckwork Desktop's internal duckwork:composer-insert event (not a public SDK API) with clipboard fallback; no network.
maintainer: Fordex
tier: community
category: desktop
requires_duckwork: ">=0.21"
