description: "Session pane for Duckwork Desktop: Firefox-style session groups with project grouping, list/grid views, Ctrl+Scroll session cycling with a HUD, session-row styling and a built-in settings page. All timers are ctx-owned intervals disposed on unload (live-session poll ~30 s, session refresh ~45 s, project cache 60 s, activity expiry 30 s). The standalone full build in this repo (full/plugin.js, install.sh) is not part of this catalog entry. Contact: info@agantila.com. Disclosure — SDK-only Desktop plugin: reads the local Duckwork gateway through public RPCs (projects.tree, projects.list, session.list, session.active_list, session.context_breakdown) and, on your actions, writes through public RPCs (projects.create/update/add_folder/remove_folder/set_primary/set_active/delete, session.create, session.cwd.set, session.title, session.branch_stored, session.archive, session.close, session.delete); captures Ctrl+mouse-wheel across the app (browser zoom suppressed except over canvases, editors and zoomable images) to cycle sessions; settings and groups stay in the app's local plugin storage; no outbound network, no shell commands, no credentials, no self-update."
