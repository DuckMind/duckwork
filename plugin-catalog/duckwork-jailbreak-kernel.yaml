description: "Jailbreak-kernel plugin for Duckwork Agent (ported from dsh-infinite-gen-4): session-scoped modes (off/slim/on/full) with kernel profiles (core/research/creative/max), session-aware system-prompt sections, llm_request request-layer system rebuild, and opencode session rotation, removing model refusals. Ships a /jailbreak command, a progressive-disclosure ops skill, and a 276-check offline self-test. Disclosure — llm_request middleware that, by default (`on`/`full` modes), replaces the system prompt on every request with a refusal-removal (\"jailbreak\") kernel plus only the memory and runtime-environment sections (agent rules, skills index, context files and other plugins' sections are dropped); `slim` appends it instead, and `off` passes requests through but strips all plugin prompt sections, including other plugins'. Rotates the x-opencode-session header on opencode routes. Writes a diagnostic dump per session (full system prompt incl. memory/persona text, plus the first 200 chars of every other message and the model/provider/base_url) to its own plugin dir (dumps/); `/jailbreak dump off` or `DUCKWORK_JAILBREAK_DUMP=0` turns it off. No network, no exec."
