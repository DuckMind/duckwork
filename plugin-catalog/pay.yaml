description: "Discover priced APIs and pay per request (HTTP 402, x402, MPP) in stablecoins through the official hosted Pay MCP server (Streamable HTTP at https://connect.pay.sh/mcp, OAuth sign-in, no keys or local wallet), with the pay workflow skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/), no Python or executables. Disclosure — payments plugin for pay.sh: the curl tool spends the hosted Pay account's stablecoin balance; hosted Pay enforces the account's spending limits (none move until the user sets them) and confirms each payment through MCP elicitation, declined when nobody can answer; the plugin marks its server untrusted, but the documented OAuth setup (`duckwork mcp add pay`) replaces that entry with a native one that runs at `trust: full` unless the user sets `mcp_servers.pay.trust: untrusted`; chats sharing a Duckwork profile share its Pay account; the tool set is served by the remote MCP server at runtime and is not covered by the pinned sha."
