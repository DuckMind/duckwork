version: "0.1.1"
description: "Search archived coding conversations and retrieve exact session revisions through the separately installed Agent Vault macOS app. Launches the app's existing MCP server through sh; reads the authorized archive through its local daemon. Vault handles storage-provider traffic. No bundled binaries, telemetry, credential-file reads, self-updater, or new background service. Disclosure — launches the separately installed Agent Vault app's own bundled Node MCP server (/Applications/Agent Vault.app or VAULT_APP_PATH) through sh with your VAULT_MCP_TOKEN binding token; that server code ships with the app, not in this repository. Its tools return archived conversations from Cursor, Codex, Claude Code and Duckwork stored under ~/.vault (or VAULT_HOME) into the model's context, which is sent to your model provider. The app handles its own storage-provider traffic; the plugin adds no telemetry, network calls, credential-file reads or background service."
maintainer: Fordex
tier: community
category: tools
requires_duckwork: ">=0.22.4"
docs_url: "https://github.com/DuckMind/duckwork/tree/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/agentvault/aed2dc6a90bf/README.md"
readme: true
platforms: [macos]
known_issues:
- Requires the separately installed, running Agent Vault app and an authorized Duckwork binding.
- Existing mcp_servers.vault configuration takes precedence over the plugin server.
capabilities:
  provides_tools:
  - mcp__vault__search_sessions
  - mcp__vault__get_session
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - VAULT_MCP_TOKEN
