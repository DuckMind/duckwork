description: "A Duckwork Desktop pane for the built-in memory: see what the focused chat remembered, updated or forgot, and edit, delete or undo any entry without leaving the conversation. Works alongside the built-in memory; not a memory provider. Disclosure — a tool_execution middleware reads MEMORY.md and USER.md around each memory call and logs the entry-level changes to $DUCKWORK_HOME/plugin-data/duckwork-memory-pane/; the pane rewrites memory entries only when the user edits, deletes, adds or undoes one, through Duckwork's own memory store; no network, credentials, shell commands or background processes."
