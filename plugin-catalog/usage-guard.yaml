# Catalog entry for DuckMind/duckwork: plugin-catalog/usage-guard.yaml
# Pinned to tag v0.4.1 (release published 2026-10-24). Bump sha and version together.
name: usage-guard
repo: https://github.com/DuckMind/duckwork
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "Keeps an agent inside its subscription allowance: refuses a provider dispatch once a subscription usage window is exhausted, so an account that allows paid extra usage stops at the wall instead of spending overage. Reads the usage Duckwork already displays, holds no credentials, and never touches account or billing settings. Disclosure — refuses main-loop provider calls (including MoA turns) for the providers in `provider_keys` (Anthropic and OpenAI Codex by default) when a subscription usage window reaches `threshold_percent`, and by default (`fail_open: false`) also refuses when usage data is missing, stale, unreadable, or the guard's own config is malformed; usage is read through Duckwork's own account-usage fetcher (no credentials held, at most one read per source every 180 seconds by default) and cached in $DUCKWORK_HOME/plugin-data/usage-guard/usage.json; a `pre_llm_call` hook adds a short usage note to the next turn's context at 80% and 90% used by default, and an opt-in (off by default) `llm_request` middleware lowers an existing output-token budget near the usage limit; both read only the cache, never the network; auxiliary calls (compression, vision, titles, MoA advisors) are not gated."
image: https://github.com/DuckMind/duckwork/raw/86b0c19d1504bc127a6c34d8a8d146e58276ef63/plugins/catalog-vendor/usage-guard/418e7120869b/docs/banner.jpg
