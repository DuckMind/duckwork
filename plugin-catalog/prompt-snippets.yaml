description: "Prompt snippet library for the Duckwork Desktop composer: a quick-pick overlay styled after the app's own slash menu (own shortcut), plus a management view with drag reordering, group tags and import/export. Inserts into the focused session, not the active one. UI in EN / 简中 / 繁體. v1.8.0 is fully SDK-only: the quick-pick overlay renders as an official Popover anchored to the plugin's own contributed node and all draft writes go through the host composer draft API. No local network; v1.6.0+ adds local JSON import/export via the system clipboard."
