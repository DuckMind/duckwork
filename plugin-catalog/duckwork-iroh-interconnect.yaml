description: "Authenticated Duckwork agent-to-agent tasks and optional file transfer over Iroh QUIC. Disclosure — tasks from a paired peer run in your live gateway agent with its full toolset; pairing is confirmed via the tool's confirm=true argument, not a UI prompt. Uses n0's public relays by default (DUCKWORK_IROH_RELAY=off or a self-hosted URL for LAN-only). iroh_send_file can share any readable path the model names (credential-name denylist only, overridable with allow_sensitive); remote-triggered auto-fetch is off by default and confined to DUCKWORK_IROH_AUTO_FETCH_DIR. The Rust sidecar is built locally with cargo, never downloaded."
