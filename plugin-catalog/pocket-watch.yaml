description: "Dashboard-only cron companion: a Pocket Watch pane showing cron jobs by schedule (daily/weekly/monthly), a health view of run outcomes and consecutive failures, a timeline, and maintenance actions — a read-oriented window onto the scheduler rather than another agent-facing toolset. Disclosure — the pane's API reads the cron jobs file under DUCKWORK_HOME to render schedules and run history; it registers no tools, hooks or middleware, performs no network I/O and holds no credentials."
