description: "Communication boards, explicit speech, switch scanning and reviewed AI proposals for Duckwork Desktop. Disclosure — Desktop-only page; Speak sends your message text through the Duckwork gateway to the TTS provider configured in Duckwork (cloud providers receive it) and the audio plays on the gateway host, which may be remote; the AI helpers open a separate Duckwork chat session per request and send your topic or message as a normal agent turn on your model provider; saved phrases and approved boards are kept in plaintext in the plugin's Desktop storage."
