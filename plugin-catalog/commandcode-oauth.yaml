version: "0.1.4"
readme: true
platforms: []
known_issues:
- Model-scoped RPM cooldowns and fail-closed OAuth routing require the companion Duckwork core fix; unpatched cores can still exhaust sibling models or resolve an unavailable OAuth route through another provider.
- Older cores may incorrectly warn about this provider's vendor/model IDs in duckwork doctor; generic profile namespace support is proposed in upstream PR 134900.
