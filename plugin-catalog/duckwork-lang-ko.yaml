description: >-
  Korean (한국어) language pack for Duckwork Desktop — Desktop UI (5,282 of 5,384 keys on v0.22.5 and main cb757fac59; 349 new translations); CLI, gateway and TUI keep the Korean catalogs already bundled with Duckwork. Independent translation from the English source; values identical to English are omitted so missing strings fall back to English. Disclosure — text-only catalogs plus an __init__.py whose register() is a no-op (kept so Desktop "Install from Git" accepts the pack, #138118); registering the pack never changes display.language, the user opts in via config.
