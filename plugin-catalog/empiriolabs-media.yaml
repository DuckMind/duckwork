description: >-
  EmpirioLabs AI backends for Duckwork' image_generate, video_generate and text_to_speech tools (backend `empiriolabs` for image_gen.provider, video_gen.provider and tts.provider): image generation and editing, text-to-video and image-to-video, and text-to-speech, with models and voices from the live EmpirioLabs AI catalog. Submitted by EmpirioLabs AI. Disclosure: registers three backends and nothing else (no tools, hooks, commands or threads); when one is selected and its tool is called, the prompt, source images or text to speak go to https://api.empiriolabs.ai/v1 (or EMPIRIOLABS_BASE_URL) with EMPIRIOLABS_API_KEY, read through Duckwork' secret scope, and each call is billed to that EmpirioLabs AI account with no Duckwork approval prompt; it reads the model catalog (GET /v1/models), polls GET /v1/jobs/{id} while a generation runs (videos up to 15 minutes by default), downloads the generated files from the returned URLs into Duckwork' cache (the key is never sent to them), and reads a local image file only when the agent asks to edit one.
