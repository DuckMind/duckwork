description: Persistent agent memory over a mnemostack service or a local Qdrant — hybrid recall (vector + lexical + graph), verbatim capture with self-echo suppression, and soft retraction. Multi-tenant when pointed at a shared authenticated service; the tenant is resolved server-side from the service key. Disclosure — the pinned directory is a discovery shim; the provider code installs from PyPI at the version pinned in plugin.yaml pip_dependencies (duckwork-mnemostack==1.0.3) into the Duckwork venv. Configured via MNEMOSTACK_* env vars; no key is required for a purely local Qdrant setup.
maintainer: Fordex
