# Duckwork catalog wrapper. Not a buildable distribution: the package that
# ships on PyPI is integrations/duckwork (mnemosyne-duckwork). Duckwork reads
# [project].dependencies from this file and installs them into its venv.
[project]
name = "mnemosyne-plugin"
version = "0.7.3"
description = "Mnemosyne memory provider for Duckwork Agent, catalog wrapper"
requires-python = ">=3.11"
dependencies = [
    "mnemosyne-duckwork>=0.7.3,<0.8",
    "mnemosyne-memory[embeddings]>=4.0.0b3",
]
