description: Encrypted, fully offline memory provider. AEAD-encrypted local vault (vectors included), bundled embedding model, exact hybrid search, no API key and no network at runtime. One vault shared with Claude, Cursor and any other MCP client on the machine. Disclosure — installs the full compartment engine (about 27 Python packages including onnxruntime, tokenizers, mcp and system-tray dependencies) into the Duckwork venv; the provider's system prompt instructs the model to store passwords and API keys in the encrypted vault.
