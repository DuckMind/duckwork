name: "duckwork-board"
title: Board
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: "A Miro-like board the agent draws with its own tools and you edit in a desktop pane, both sides working on one JSON document. board_apply builds a whole diagram in one call from ordered ops (nodes, edges, free lines, groups, notes, captions, layered auto-layout, bus trunks); board_render writes a PNG for chat or the interactive HTML editor; board_watch reports your own pane edits back to the agent. The pane docks beside the conversation with the same editor, saves your edits, and takes agent updates live. Disclosure — board_render shells out to a headless Chrome/Chromium already on PATH (nothing is downloaded; private temp profile, sandbox kept unless running as root) for PNG and self-test rendering; boards live in ~/.duckwork/board/ shared across profiles (DUCKWORK_BOARD_DIR / DUCKWORK_BOARD_RENDER_DIR / DUCKWORK_BOARD_WATCH override); serves /api/plugins/duckwork-board/ on the plugin host; reads this profile's state.db read-only to find the session board_watch should wake; no external network calls and no stored credentials; board_watch's wake into a messaging chat additionally needs plugins.entries.duckwork-board.allow_gateway_injection: true."
maintainer: Fordex
