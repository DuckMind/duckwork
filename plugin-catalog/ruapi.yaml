description: >-
  RuAPI as Duckwork model providers on one key: `ruapi` serves Claude models over RuAPI's native Anthropic Messages API (so Duckwork' Anthropic prompt caching and thinking apply), and `ruapi-openai` serves GPT, Gemini, DeepSeek, GLM, Qwen, Kimi and other chat models over its OpenAI-compatible API. Each /model picker lists that side's chat models from the account's GET /v1/models list, leaving out image and video models, and context windows and image input are declared for the main models. Maintained by RuAPI. Disclosure — registers two model providers at import and nothing else (no tools, hooks, commands or threads). Prompts, tool schemas and RUAPI_API_KEY go to https://www.ruapi.ai (/v1/messages and /v1/chat/completions) through Duckwork' own clients, and RuAPI forwards each request to the upstream vendor serving the model. The model list is Duckwork' standard GET https://www.ruapi.ai/v1/models request with the key; the plugin makes no network requests of its own, adds no headers, sends no telemetry, reads or writes no files and stores no credentials.
