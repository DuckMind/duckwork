description: >-
  Cloudflare Workers AI as a Duckwork model provider (`--provider workers-ai`, or Cloudflare Workers AI in `duckwork model`, which asks for the token and the account's base URL): the 16 Workers AI models with function calling and 64K+ context, Cloudflare's context windows (a custom endpoint lists no models and assumes 256K for the 128K gpt-oss), reasoning effort in the form each model accepts, and a clear message when a free-plan account picks a paid-plan model. Not affiliated with Cloudflare. Disclosure — registers one model provider at import and nothing else (no tools, hooks, commands or threads); the model list and details are built in, so nothing is fetched to show them; chat requests go to the URL in CLOUDFLARE_WORKERS_AI_BASE_URL through Duckwork' own client with CLOUDFLARE_WORKERS_AI_API_TOKEN, both read by Duckwork per profile; the plugin itself opens no connections, reads and writes no files and starts no processes.
