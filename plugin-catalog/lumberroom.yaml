description: lumberroom memory provider. One durable store shared with every agent you use, recalled on every turn and written through the engine's own memory_write. Self-hosted open-source engine or lumberroom.cloud; OAuth or a static token. Maintained by the lumberroom team. Disclosure — when active, every non-trivial user message (first 1,000 characters) and the absolute git-root path of the working directory are sent on each turn to the configured lumberroom engine, which defaults to https://mcp.lumberroom.cloud (operated by Cybersapien Technologies, India) unless base_url names a self-hosted engine; the model is instructed to store decisions, preferences and facts there through memory_write, the engine's live tool descriptions and server instructions are injected into the system prompt each session, and setup switches off Duckwork' built-in MEMORY.md/USER.md store.
