name: "duckwork-monitor"
repo: "https://github.com/DuckMind/duckwork"
sha: "86b0c19d1504bc127a6c34d8a8d146e58276ef63"   # v0.3.5 (main)
version: "0.3.5"
description: "Kanban worker health in the Desktop status bar — live activity per running card with stall and loop detection (same tool + same arguments repeated), plus a compact per-provider quota readout (the related ai-usage-tracker plugin covers quota windows as a standalone feature). Zero model tokens. Disclosure — opens DUCKWORK_HOME/kanban.db and each profile's state.db read-only for worker activity; for quota chips it reads every Duckwork profile's credential pool (each profile's auth.json, with that profile's .env as secret scope) into read-only snapshots plus DEEPSEEK_API_KEY from the environment or .env files, and calls Duckwork' own account-usage fetchers for each configured provider (Anthropic, Codex, OpenRouter, DeepSeek at https://api.deepseek.com/user/balance, and any provider plugin exposing fetch_account_usage), sending each entry's own token only to its own provider. The plugin never refreshes or persists a credential; on a Codex HTTP 401, Duckwork core may refresh the active profile's matching Codex token via OpenAI's token endpoint and rewrite that profile's auth.json. No other network egress."
