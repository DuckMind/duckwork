# Modified by Fordex for Duckwork distribution on 2026-11-17: fork-owned names and paths rebranded; original authorship and notices retained.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Duckwork commit the plugin is checked against (README "Checked against").
  DUCKWORK_COMMIT: 22063fc099ec9ad8357d7f8f6e6248a0400680d3

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      # Read-only checkout of Duckwork for the integration test. Duckwork refuses wheel builds,
      # so it is put on PYTHONPATH instead of pip-installed; ruamel.yaml is the only
      # dependency the plugin manager needs.
      - uses: actions/checkout@v4
        with:
          repository: Fordex/duckwork-agent
          ref: ${{ env.DUCKWORK_COMMIT }}
          path: .duckwork-agent
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "ruamel.yaml==0.18.16"

      # Tests run in an empty network namespace, so any network access fails.
      - name: pytest (no network)
        run: |
          sudo unshare --net -- sudo -u "$USER" env PATH="$PATH" HOME="$HOME" \
            PYTHONPATH="$GITHUB_WORKSPACE/.duckwork-agent" \
            python -m pytest tests -v -rs

  # Duckwork' own plugin checks. Its CLI dependencies need Python 3.14.
  duckwork-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Fordex/duckwork-agent
          ref: ${{ env.DUCKWORK_COMMIT }}
          path: .duckwork-agent
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Duckwork
        run: |
          python -m pip install uv
          uv venv -p "$(command -v python)" "$RUNNER_TEMP/duckwork-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/duckwork-venv" uv pip install -e .duckwork-agent

      # Plugin enabled through config.yaml in a temporary DUCKWORK_HOME; no network.
      - name: duckwork plugins validate / doctor (no network)
        run: |
          sudo unshare --net -- sudo -u "$USER" env PATH="$PATH" HOME="$HOME" \
            .github/scripts/duckwork-tools.sh "$RUNNER_TEMP/duckwork-venv/bin/duckwork"
