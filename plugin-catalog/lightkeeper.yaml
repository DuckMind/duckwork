known_issues:
- "Verified with a real model on Duckwork stable 0.22.2 in duckwork chat -q mode: patch and write_file, the edit pointer, the verify-gate reminder, the note update and the session-end notice. Not yet verified: the messaging gateways, interactive multi-turn sessions, turns after a context compaction, concurrent sessions on one gateway, and host-unified main builds."
- "Does nothing until a vault covers the session's working directory: create one with python3 ~/.duckwork/plugins/lightkeeper/bin/vault init <vault folder> --name <name> --repo <checkout> (README, Duckwork Agent section). Needs the local terminal backend."
