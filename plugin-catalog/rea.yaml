description: 'Reverse engineer programs with REA (rea.tools): native binaries, .NET assemblies, Electron/JavaScript apps, Android packages, firmware and browser/process activity, through REA''s MCP server (pinned rea-agents@6.7.0 over npx stdio) with REA''s reverse-engineer-anything skill adapted for Duckwork. Portable Agent Plugins v1 package (mcp.json + skills/); needs Node.js 22.19+/24.11+/26+ on PATH, plus your own Ghidra, Hopper or IDA for native decompilation. Disclosure — a few REA tools run a command under a PTY, launch or drive an application, change a connected Android device or overwrite a chosen file, and Duckwork does not prompt before them; the bundled skill tells the agent to ask first and to skip them in unattended runs.'
