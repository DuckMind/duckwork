description: "Linkup web search: live cited search (fast/standard/deep), URL-to-Markdown fetch with JS rendering, async deep research, and a Linkup backend for the built-in web_search / web_extract tools. Disclosure — sends search queries, fetch URLs and research briefs to api.linkup.so with your LINKUP_API_KEY (Linkup fetches pages server-side); when selected with duckwork linkup use-as-web-backend it also handles the built-in web_search and web_extract calls; large fetched pages are cached under $DUCKWORK_HOME/cache/linkup for 24 hours."
maintainer: Fordex
