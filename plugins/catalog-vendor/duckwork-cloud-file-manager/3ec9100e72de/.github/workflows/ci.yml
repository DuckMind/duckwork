name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Early warning: once a week (or on demand) the same suite runs against each repo's newest `main`, so a breaking
  # change shows up before a pin bump or release. A red run here blocks nothing; it means "look before bumping".
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Duckwork builds the plugin is checked against. Bump deliberately (see README "Compatibility").
  # Pushes and pull requests use the pinned SHAs below; scheduled and manual runs use each repo's `main`.
  DUCKWORK_REVISION: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || 'pinned' }}
  DUCKWORK_UPSTREAM_REPO: Fordex/duckwork-agent
  DUCKWORK_UPSTREAM_SHA: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || '818c13be1dc4fd28987e1e881a9408224afd4535' }}
  DUCKWORK_FORK_REPO: electricsheephq/evaOS-duckwork-desktop-app-adapter
  DUCKWORK_FORK_SHA: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || '9edf23c47c1e1b04515c966717ddce6008c1d2dd' }}

jobs:
  desktop:
    name: Desktop half (types, tests, bundle, SDK surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Committed bundle matches source
        run: npm run check:bundle
      - name: Fetch ${{ env.DUCKWORK_REVISION }} Duckwork Desktop SDKs
        run: |
          for pair in "upstream $DUCKWORK_UPSTREAM_REPO $DUCKWORK_UPSTREAM_SHA" "fork $DUCKWORK_FORK_REPO $DUCKWORK_FORK_SHA"; do
            set -- $pair
            mkdir -p "pinned/$1"
            git -C "pinned/$1" init -q
            git -C "pinned/$1" remote add origin "https://github.com/$2.git"
            git -C "pinned/$1" sparse-checkout set apps/desktop/src/sdk apps/desktop/src/contrib
            git -C "pinned/$1" fetch -q --depth 1 origin "$3"
            git -C "pinned/$1" checkout -q FETCH_HEAD
          done
      - name: Every imported SDK name exists in both ${{ env.DUCKWORK_REVISION }} SDKs
        run: node scripts/check-sdk-exports.mjs pinned/upstream/apps/desktop/src/sdk/index.ts pinned/fork/apps/desktop/src/sdk/index.ts
      - name: Both ${{ env.DUCKWORK_REVISION }} runtime loaders accept the bundle (import scanner), and the trap fixture is caught
        run: |
          node scripts/check-loader-scan.mjs pinned/upstream/apps/desktop/src/contrib/runtime-loader.ts pinned/fork/apps/desktop/src/contrib/runtime-loader.ts
          node scripts/check-loader-scan.mjs --self-test pinned/upstream/apps/desktop/src/contrib/runtime-loader.ts pinned/fork/apps/desktop/src/contrib/runtime-loader.ts
      - name: No self-updater (catalog rule 3)
        run: |
          # Same shape as the upstream catalog CI: a JS/TS file that both names a release/raw URL and writes files.
          bad=$(grep -rlE "releases/latest|raw\.githubusercontent\.com" --include='*.js' --include='*.ts' --include='*.tsx' desktop src | xargs -r grep -lE "writeTextFile|renamePath|writeFile\(" || true)
          if [ -n "$bad" ]; then echo "self-updater pattern in: $bad"; exit 1; fi

  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS matters: its default filesystem is case-insensitive, which the path guard must handle.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fastapi==0.133.1" "starlette==1.3.1" httpx pytest
      - run: python -m pytest

  duckwork:
    name: Against ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || 'pinned' }} Duckwork (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [upstream, fork]
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Resolve ${{ env.DUCKWORK_REVISION }} Duckwork
        id: pin
        run: |
          if [ "${{ matrix.target }}" = upstream ]; then
            echo "repo=$DUCKWORK_UPSTREAM_REPO" >> "$GITHUB_OUTPUT"; echo "sha=$DUCKWORK_UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "repo=$DUCKWORK_FORK_REPO" >> "$GITHUB_OUTPUT"; echo "sha=$DUCKWORK_FORK_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: duckwork
      - uses: astral-sh/setup-uv@v6
      - name: Install Duckwork from its own lockfile
        run: |
          cd duckwork
          uv sync --frozen --no-dev
          uv pip install --python .venv/bin/python pytest httpx
      - name: duckwork plugins validate (catalog admission checks)
        if: matrix.target == 'upstream'
        env:
          DUCKWORK_HOME: ${{ runner.temp }}/duckwork-home
        run: duckwork/.venv/bin/duckwork plugins validate plugin
      - name: Backend tests inside a real Duckwork install
        env:
          DUCKWORK_HOME: ${{ runner.temp }}/duckwork-home
        run: cd plugin && ../duckwork/.venv/bin/python -m pytest
