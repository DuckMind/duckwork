name: secret-drop
repo: "https://github.com/DuckMind/duckwork"
sha: 86b0c19d1504bc127a6c34d8a8d146e58276ef63
description: 'Store a secret on the gateway host without showing it to the model. Disclosure — stores the value in plaintext in the profile .env (mode 0600) and adds the name to terminal.env_passthrough, so $NAME is available to the terminal tool; the model can still read the value with its own tools (cat .env, echo $NAME). Keeps secrets out of chat/prompt context and redacts verbatim output of credential-shaped values; it is not a boundary against a model that deliberately reads it. Adds a static system-prompt section and a /secret command. Imports private core helpers read-only (_config_profile_scope, _is_duckwork_provider_credential, _CONFIG_LOCK).'
maintainer: Fordex
tier: community
category: desktop
